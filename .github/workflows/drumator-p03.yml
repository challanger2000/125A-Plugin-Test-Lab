name: P03 Real Drumator Swing Host Test

# A deliberately separate, costly integration gate; not every push to main.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main.cpp'
      - 'tests/make_drumator_state.py'
      - 'tests/verify_drumator_swing.py'
      - 'tests/verify_drumator_recall.py'
      - 'tests/verify_drumator_matrix.py'
      - 'tests/verify_drumator_v15_acceptance.py'
      - 'tests/test_drumator_v15_acceptance.py'
      - 'tests/drumator_midi_probe.cpp'
      - 'tests/midi_probe/CMakeLists.txt'
      - 'tests/verify_midi_export.py'
      - 'tests/drumator_beat_probe.cpp'
      - 'tests/verify_beat_creator.py'
      - 'tests/drumator_wav_probe.cpp'
      - 'tests/verify_wav_export.py'
      - 'src/gui_host.cpp'
      - 'tests/verify_drumator_gui.py'
      - 'tests/verify_export_dialogs.py'
      - 'tests/make_gui_export_state.py'
      - 'tests/verify_gui_save_as.py'
      - 'tests/make_invalid_state_matrix.py'
      - 'tests/build_release_report.py'
      - 'tests/test_release_evidence_gate.py'
      - '.github/workflows/drumator-p03.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:
    inputs:
      drumator_ref:
        description: 'Product branch, tag, or commit SHA to test'
        type: string
        required: true
        default: 'develop/beat-creator-10-styles-20261102'

concurrency:
  group: 125a-testlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actual-drumator-vst3:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout the test lab
        uses: actions/checkout@v4

      - name: Checkout EXACT V1.5 Drumator revision (no release code modifications)
        uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Drumator-Final
          # PR checks MUST exercise the exact independently CI-verified 6 Nov V1.5 GUI-polish release source.
          # Manual actions may use a different explicit branch/commit but are never confused with release SHA.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.drumator_ref || '3f1e82c99e716071486fa73b81c3e4f062400276' }}
          path: drumator-src
          persist-credentials: false

      - name: Verify and record exact product revision
        shell: pwsh
        env:
          REQUESTED_PRODUCT_REF: ${{ inputs.drumator_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git -C drumator-src rev-parse HEAD).Trim()
          if ($actual.Length -ne 40 -or $actual -cnotmatch '^[0-9a-f]+$') {
            throw "Invalid resolved product SHA: $actual"
          }
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -and
              $actual -cne '3f1e82c99e716071486fa73b81c3e4f062400276') {
            throw "PR benchmark revision changed unexpectedly: $actual"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $requested = $env:REQUESTED_PRODUCT_REF
            if ([string]::IsNullOrWhiteSpace($requested) -or
                $requested.Length -gt 180 -or
                $requested -cnotmatch '^[A-Za-z0-9._/-]+$') {
              throw "Invalid product branch/tag/SHA reference"
            }
            Write-Host "[INFO] Requested product ref: $requested"
          }
          New-Item -ItemType Directory -Force artifact/P03 | Out-Null
          "Resolved tested product revision: $actual" |
            Set-Content artifact/P03/TESTED-PRODUCT-REVISION.txt
          Write-Host "[PASS] Product SHA: $actual"

      - name: Configure Test Lab and obtain exact Steinberg SDK
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build P02-proven VST3 host
        shell: pwsh
        run: cmake --build build --config Release --target TestLabHost --parallel 4

      - name: Configure source-built real Drumator V1.5
        shell: pwsh
        run: |
          $sdk = (Resolve-Path "build/_deps/vst3sdk-src").Path
          cmake -S drumator-src -B build-drumator -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=OFF -DDRUMATOR_BUILD_VST3=ON "-DVST3_SDK_ROOT=$sdk"
          if ($LASTEXITCODE -ne 0) { throw "Drumator configure failed" }

      - name: Build real Drumator VST3 (no test double)
        shell: pwsh
        run: |
          cmake --build build-drumator --config Release --target Drumator --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Drumator VST3 build failed" }

      - name: Generate rights-clean deterministic 0/50 swing project states
        shell: pwsh
        run: |
          python tests/make_drumator_state.py build/p03-state
          if ($LASTEXITCODE -ne 0) { throw "Synthetic Drumator states failed" }

      - name: Render actual Drumator (0% and 50% swing) and verify music timing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter "125A_Test_Lab_Host.exe")
          $plugin = @(Get-ChildItem build-drumator -Recurse -File -Filter "Drumator.vst3" |
            Where-Object { $_.FullName -match '[\\/]VST3[\\/]' })
          if ($hostExe.Count -ne 1 -or $plugin.Count -ne 1) {
            throw "Expected exactly 1 host EXE and 1 actual Drumator VST3; host=$($hostExe.Count), vst3=$($plugin.Count)"
          }
          $straight = (Join-Path $PWD "build/p03-straight.wav")
          $swung = (Join-Path $PWD "build/p03-swing50.wav")
          $saved = (Join-Path $PWD "build/p03-saved-drumator.bin")
          $recallWave = (Join-Path $PWD "build/p03-recall.wav")
          $corrupt = (Join-Path $PWD "build/p03-tampered-drumator.bin")
          $negativeWave = (Join-Path $PWD "build/p03-rejected.wav")
          & $hostExe[0].FullName --render-state-save $plugin[0].FullName build/p03-state/Drumator-Swing-0.bin $straight $saved 2>&1 |
            Tee-Object build/p03-drumator-0.log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $straight)) {
            throw "Real Drumator render 0% swing failed"
          }
          & $hostExe[0].FullName --render-state $plugin[0].FullName build/p03-state/Drumator-Swing-50.bin $swung 2>&1 |
            Tee-Object build/p03-drumator-50.log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $swung)) {
            throw "Real Drumator render 50% swing failed"
          }
          python tests/verify_drumator_swing.py $straight $swung 2>&1 |
            Tee-Object build/p03-independent-oracle.log
          if ($LASTEXITCODE -ne 0) {
            throw "Independent P03 swing oracle rejected real Drumator output"
          }
          if (-not (Test-Path $saved)) { throw "Actual Drumator did not serialize its VST3 state" }
          & $hostExe[0].FullName --render-state $plugin[0].FullName $saved $recallWave 2>&1 |
            Tee-Object build/p03-recall-host.log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $recallWave)) {
            throw "Actual Drumator failed to restore its own state in fresh host process"
          }
          python tests/verify_drumator_recall.py $straight $recallWave $saved 2>&1 |
            Tee-Object build/p03-recall-oracle.log
          if ($LASTEXITCODE -ne 0) {
            throw "Independent fresh-process state/audio recall comparison FAILED"
          }
          $bytes = [System.IO.File]::ReadAllBytes($saved)
          $bytes[$bytes.Length - 1] = $bytes[$bytes.Length - 1] -bxor 0x01
          [System.IO.File]::WriteAllBytes($corrupt, $bytes)
          & $hostExe[0].FullName --render-state $plugin[0].FullName $corrupt $negativeWave 2>&1 |
            Tee-Object build/p03-recall-negative.log
          if ($LASTEXITCODE -ne 1 -or (Test-Path $negativeWave)) {
            throw "Tampered state unexpectedly accepted or produced audio"
          }
          if (-not (Get-Content build/p03-recall-negative.log -Raw).Contains("Plugin rejected supplied VST3 project state")) {
            throw "Tampered state failed for an unrelated reason"
          }
          Write-Host "[PASS] P03 actual Drumator DSP + host-saved kit + sample-exact musical swing and fresh-instance recall oracles"
          exit 0

      - name: P18 multi-state fresh-process project recall (0/25/50 Swing)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $plugin = @(Get-ChildItem build-drumator -Recurse -File -Filter 'Drumator.vst3' |
            Where-Object { $_.FullName -match '[\\/]VST3[\\/]' })
          if ($hostExe.Count -ne 1 -or $plugin.Count -ne 1) {
            throw 'P18 host or actual VST3 missing'
          }
          New-Item -ItemType Directory -Force build/p18-recall | Out-Null
          foreach ($swing in @(0, 25, 50)) {
            $inputState = "build/p03-state/Drumator-Swing-$swing.bin"
            if (-not (Test-Path -LiteralPath $inputState)) {
              throw "P18 missing independently prepared Swing state $swing"
            }
            $stateHash = (Get-FileHash -LiteralPath $inputState -Algorithm SHA256).Hash
            $before = "build/p18-recall/swing$swing-original.wav"
            $state = "build/p18-recall/swing$swing-saved.bin"
            $after = "build/p18-recall/swing$swing-recalled.wav"
            & $hostExe[0].FullName --render-state-save $plugin[0].FullName $inputState $before $state 2>&1 |
              Out-File -Append build/p18-host.log
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $state)) {
              throw "P18 render and getState failed for Swing $swing"
            }
            & $hostExe[0].FullName --render-state $plugin[0].FullName $state $after 2>&1 |
              Out-File -Append build/p18-host.log
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $after)) {
              throw "P18 fresh host process setState failed for Swing $swing"
            }
            python tests/verify_drumator_recall.py $before $after $state 2>&1 |
              Out-File -Append build/p18-independent-oracle.log
            if ($LASTEXITCODE -ne 0) {
              throw "P18 real independent sample-exact recall oracle FAILED for Swing $swing"
            }
            if ((Get-FileHash -LiteralPath $inputState -Algorithm SHA256).Hash -cne $stateHash) {
              throw "P18 test unexpectedly modified its source fixture for Swing $swing"
            }
            Write-Host "[PASS] P18 Swing $swing saved, restored in fresh plugin host and PCM compared"
          }
          Write-Host '[PASS] P18 three separate fresh-host recall tests, exact stereo PCM and state integrity'

      - name: P20 16 corrupted project states rejected without audio or crash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $plugin = @(Get-ChildItem build-drumator -Recurse -File -Filter 'Drumator.vst3' |
            Where-Object { $_.FullName -match '[\\/]VST3[\\/]' })
          if ($exe.Count -ne 1 -or $plugin.Count -ne 1) { throw 'P20 host or real VST3 missing' }
          python tests/make_invalid_state_matrix.py build/p03-state/Drumator-Swing-0.bin build/p20-invalid
          if ($LASTEXITCODE -ne 0) { throw 'P20 invalid fixture generation failed' }
          $fixtures = @(Get-ChildItem build/p20-invalid -File -Filter '*.bin' | Sort-Object Name)
          if ($fixtures.Count -ne 16) { throw "P20 expected 16 negative cases, got $($fixtures.Count)" }
          foreach ($fixture in $fixtures) {
            $wav = "build/p20-invalid/$($fixture.BaseName)-unexpected.wav"
            $log = "build/p20-invalid/$($fixture.BaseName).log"
            & $exe[0].FullName --render-state $plugin[0].FullName $fixture.FullName $wav 2>&1 |
              Tee-Object -FilePath $log | Out-Null
            if ($LASTEXITCODE -ne 1 -or (Test-Path -LiteralPath $wav)) {
              throw "P20 did not safely reject corrupt state $($fixture.Name)"
            }
            $message = Get-Content -LiteralPath $log -Raw
            if (-not $message.Contains('Plugin rejected supplied VST3 project state')) {
              throw "P20 corrupt state $($fixture.Name) failed for unexpected reason"
            }
          }
          "[PASS] P20 all 16 invalid VST3 project states rejected with no audio output" |
            Set-Content build/p20-summary.log
          Write-Host (Get-Content build/p20-summary.log -Raw)
          # The final deliberate negative host returns 1; reset the CI step
          # only after all 16 expected rejections have been asserted.
          exit 0

      - name: P05 real Drumator musical and process-buffer matrix (36 scenarios)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = @(Get-ChildItem build -Recurse -File -Filter "125A_Test_Lab_Host.exe")
          $plugin = @(Get-ChildItem build-drumator -Recurse -File -Filter "Drumator.vst3" |
            Where-Object { $_.FullName -match '[\\/]VST3[\\/]' })
          if ($exe.Count -ne 1 -or $plugin.Count -ne 1) {
            throw "P05 expected exactly one VST3 host EXE and one source-built Drumator VST3"
          }
          New-Item -ItemType Directory -Force build/p05-renders | Out-Null
          foreach ($tempo in @(90, 120, 150)) {
            foreach ($swing in @(0, 25, 50)) {
              foreach ($block in @(64, 127, 512, 1024)) {
                $state = "build/p03-state/Drumator-Swing-$swing.bin"
                $wav = "build/p05-renders/bpm$tempo-swing$swing-block$block.wav"
                & $exe[0].FullName --render-state-at $plugin[0].FullName $state $wav $tempo $block |
                  Out-File -Append -FilePath build/p05-host-renders.log
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path $wav)) {
                  throw "P05 REAL plugin render failed: tempo=$tempo swing=$swing block=$block"
                }
              }
            }
          }
          python tests/verify_drumator_matrix.py build/p05-renders 2>&1 |
            Tee-Object -FilePath build/p05-independent-matrix-oracle.log
          if ($LASTEXITCODE -ne 0) {
            throw "P05 independent musical onsets or process-block equivalence FAILED"
          }
          Write-Host "[PASS] P05: 36 independently verified real Drumator timing and buffer matrix renders"
          exit 0

      - name: P06 Drumator MIDI export implementation + independent SMF oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = (Resolve-Path drumator-src).Path
          cmake -S tests/midi_probe -B build-p06 -G "Visual Studio 17 2022" -A x64 "-DDRUMATOR_SOURCE_ROOT=$src"
          if ($LASTEXITCODE -ne 0) { throw "P06 read-only Drumator MIDI probe configure failed" }
          cmake --build build-p06 --config Release --target DrumatorMidiProbe --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "P06 actual MIDI export implementation build failed" }
          $exe = @(Get-ChildItem build-p06 -Recurse -File -Filter "125A_Drumator_MIDI_Probe.exe")
          if ($exe.Count -ne 1) { throw "P06 MIDI probe exe missing or ambiguous" }
          New-Item -ItemType Directory -Force build/p06-exports | Out-Null
          & $exe[0].FullName build/p06-exports 2>&1 |
            Tee-Object -FilePath build/p06-real-export.log
          if ($LASTEXITCODE -ne 0) { throw "P06 product MIDI exporter generated invalid data" }
          python tests/verify_midi_export.py build/p06-exports 2>&1 |
            Tee-Object -FilePath build/p06-independent-midi-oracle.log
          if ($LASTEXITCODE -ne 0) {
            throw "P06 independent SMF parser rejected product MIDI export"
          }
          Write-Host "[PASS] P06 18 MIDI export files independently parsed, plus negative mutations"
          exit 0

      - name: P07 Beat Creator 10-style A/B/C independent structural validation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build-p06 --config Release --target DrumatorBeatCreatorProbe --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Beat Creator read-only probe compilation failed" }
          $exe = @(Get-ChildItem build-p06 -Recurse -File -Filter "125A_Drumator_Beat_Probe.exe")
          if ($exe.Count -ne 1) { throw "Beat Creator probe missing or ambiguous" }
          New-Item -ItemType Directory -Force build/p07-creator-vectors | Out-Null
          & $exe[0].FullName build/p07-creator-vectors 2>&1 |
            Tee-Object -FilePath build/p07-real-creator.log
          if ($LASTEXITCODE -ne 0) { throw "Real Beat Creator failed setup or invariant checks" }
          python tests/verify_beat_creator.py build/p07-creator-vectors 2>&1 |
            Tee-Object -FilePath build/p07-independent-beat-oracle.log
          if ($LASTEXITCODE -ne 0) { throw "Independent Beat Creator pattern oracle FAILED" }
          Write-Host "[PASS] P07: 1,280 Beat Creator A/B/C patterns validated across ten styles"
          exit 0

      - name: P08 actual WAV export vs independently validated MIDI timing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build-p06 --config Release --target DrumatorWavExportProbe --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "P08 offline WAV exporter read-only compilation failed" }
          $exe = @(Get-ChildItem build-p06 -Recurse -File -Filter "125A_Drumator_WAV_Probe.exe")
          if ($exe.Count -ne 1) { throw "P08 WAV probe executable missing or ambiguous" }
          New-Item -ItemType Directory -Force build/p08-wav-exports | Out-Null
          & $exe[0].FullName build/p08-wav-exports 2>&1 |
            Tee-Object -FilePath build/p08-actual-wav-export.log
          if ($LASTEXITCODE -ne 0) { throw "P08 real WAV export failed" }
          python tests/verify_wav_export.py build/p08-wav-exports build/p06-exports 2>&1 |
            Tee-Object -FilePath build/p08-independent-wav-midi-oracle.log
          if ($LASTEXITCODE -ne 0) {
            throw "P08 independent PCM24, stereo or MIDI-to-WAV musical timing check FAILED"
          }
          Write-Host "[PASS] P08: 18 actual PCM24 WAV exports match independent MIDI timing reference"
          exit 0

      - name: P09 true Drumator VST3 GUI GENERATE / CANCEL / APPLY state changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build --config Release --target TestLabGUI --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "P09 native VST3 GUI host compilation failed" }
          $exe = @(Get-ChildItem build -Recurse -File -Filter "125A_Test_Lab_GUI.exe")
          $plugin = @(Get-ChildItem build-drumator -Recurse -File -Filter "Drumator.vst3" |
            Where-Object { $_.FullName -match '[\\/]VST3[\\/]' })
          if ($exe.Count -ne 1 -or $plugin.Count -ne 1) {
            throw "P09 actual Drumator/editor host paths missing or ambiguous"
          }
          # Unlike audio-only P03-P08, a VSTGUI editor needs the standard
          # VST3 Contents/Resources directory. The product release workflow
          # packages these resources; recreate that bundle READ-ONLY in Test Lab.
          $bundle = Join-Path $PWD 'build/p09-bundle/125A Drumator.vst3'
          $binDir = Join-Path $bundle 'Contents/x86_64-win'
          $resDir = Join-Path $bundle 'Contents/Resources'
          New-Item -ItemType Directory -Force $binDir,$resDir,'build/p09-gui' | Out-Null
          $packagedBinary = Join-Path $binDir '125A Drumator.vst3'
          Copy-Item -LiteralPath $plugin[0].FullName -Destination $packagedBinary
          $required = @(
            'Drumator.uidesc',
            '125A_Drumator_Knob.png', '125A_Drumator_Screw.png',
            '125A_Drumator_Faceplate.png',
            'Futuristische industrielle Metalloberfläche.png',
            '125A_Dark_Button_83x32_Normal_1x.png',
            '125A_Dark_Button_83x32_Normal_4x.png',
            '125A_Dark_Button_83x32_Aktiv_1x.png',
            '125A_Dark_Button_83x32_Aktiv_4x.png',
            '125A_Dark_Button_83x32_Gedrueckt_1x.png',
            '125A_Dark_Button_83x32_Gedrueckt_4x.png',
            '125A_Dark_Button_83x32_Deaktiviert_1x.png',
            '125A_Dark_Button_83x32_Deaktiviert_4x.png',
            'DRUMATOR_Logo_Modern_Transparent.png',
            '125A Systems Metall-Logo Badge.png'
          )
          foreach ($filename in $required) {
            $source = Join-Path 'drumator-src/resource' $filename
            if (-not (Test-Path -LiteralPath $source)) {
              throw "P09 standard VST3 GUI resource missing: $filename"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $resDir $filename)
          }
          $before = "build/p09-gui/before.bin"
          $cancel = "build/p09-gui/cancel.bin"
          $after = "build/p09-gui/after.bin"
          & $exe[0].FullName --drumator-beat-creator $packagedBinary $before $cancel $after 2>&1 |
            Tee-Object -FilePath build/p09-real-native-gui.log
          if ($LASTEXITCODE -ne 0) {
            throw "P09 native real Drumator GUI interaction failed"
          }
          python tests/verify_drumator_gui.py $before $cancel $after 2>&1 |
            Tee-Object -FilePath build/p09-independent-gui-oracle.log
          if ($LASTEXITCODE -ne 0) {
            throw "P09 actual Drumator GUI actions did not produce expected real processor state changes"
          }
          Write-Host "[PASS] P09: actual Drumator GUI mouse input => A/B/C changed and CANCEL preserved state"
          exit 0

      - name: P17 real Drumator GUI lifecycle stress (16 detach/reattach cycles)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $bundle = Join-Path $PWD 'build/p09-bundle/125A Drumator.vst3/Contents/x86_64-win/125A Drumator.vst3'
          if ($exe.Count -ne 1 -or -not (Test-Path -LiteralPath $bundle)) {
            throw 'P17 genuine VST3 editor bundle or GUI host missing'
          }
          New-Item -ItemType Directory -Force build/p17-gui-stress | Out-Null
          & $exe[0].FullName --drumator-gui-lifecycle $bundle build/p17-gui-stress 2>&1 |
            Tee-Object -FilePath build/p17-gui-stress.log
          if ($LASTEXITCODE -ne 0) {
            throw 'P17 real editor detach/reattach or project-state integrity failed'
          }
          $log = Get-Content 'build/p17-gui-stress.log' -Raw
          if (-not $log.Contains('[PASS] P17 all 16 editor lifecycle cycles stable')) {
            throw 'P17 test host exited 0 without completing all 16 lifecycle assertions'
          }
          Write-Host '[PASS] P17 16 real production GUI close/reopen cycles without state corruption'

      - name: P19 real GUI control stress (96 clicks, 48 exact state roundtrips)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gui = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $bundle = Join-Path $PWD 'build/p09-bundle/125A Drumator.vst3/Contents/x86_64-win/125A Drumator.vst3'
          if ($gui.Count -ne 1 -or -not (Test-Path -LiteralPath $bundle)) {
            throw 'P19 real native GUI host or plugin bundle missing'
          }
          New-Item -ItemType Directory -Force build/p19-gui-stress | Out-Null
          & $gui[0].FullName --drumator-gui-control-stress $bundle build/p19-gui-stress 2>&1 |
            Tee-Object -FilePath build/p19-control-stress.log
          if ($LASTEXITCODE -ne 0) { throw 'P19 native GUI control stress failed' }
          if (-not (Get-Content build/p19-control-stress.log -Raw).Contains('[PASS] P19 96 real GUI clicks and 48 state roundtrips')) {
            throw 'P19 test returned zero without completing all 48 roundtrips'
          }
          Write-Host '[PASS] P19 real production GUI limiter stress and processor state integrity'

      - name: P10 actual Win32 Save dialog opens and CANCEL is non-destructive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $bundle = Join-Path $PWD 'build/p09-bundle/125A Drumator.vst3/Contents/x86_64-win/125A Drumator.vst3'
          if ($exe.Count -ne 1 -or -not (Test-Path -LiteralPath $bundle)) {
            throw 'P10 actual editor host or fully packaged Drumator bundle missing'
          }
          New-Item -ItemType Directory -Force build/p10-export-dialogs | Out-Null
          & $exe[0].FullName --drumator-export-dialog-cancel $bundle build/p10-export-dialogs 2>&1 |
            Tee-Object -FilePath build/p10-native-save-dialogs.log
          if ($LASTEXITCODE -ne 0) {
            throw 'P10 actual Windows Shell Save dialogs not reliably opened/canceled'
          }
          python tests/verify_export_dialogs.py build/p10-export-dialogs 2>&1 |
            Tee-Object -FilePath build/p10-independent-dialog-oracle.log
          if ($LASTEXITCODE -ne 0) {
