name: P52 genuine continuous VST3 GUI knob verification

on:
  pull_request:
    paths:
      - 'tests/gui_fixture.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/p52-analog-gui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-analog-positive-and-negative:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build real continuous and deliberately defective VST3 controls
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build build --config Release --target TestLabGUI QAGuiAnalogGood QAGuiAnalogBad --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Actual native VST3 build failed' }
      - name: Prove five intermediate/reverse GUI drag values and detect actual quantization bug
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          if ($hostExe.Count -ne 1) { throw 'Native GUI host missing' }
          $checkpoints = @(
            @{start_x=40;start_y=90;end_x=100;end_y=90;expected_normalized=0.25},
            @{start_x=100;start_y=90;end_x=160;end_y=90;expected_normalized=0.5},
            @{start_x=160;start_y=90;end_x=220;end_y=90;expected_normalized=0.75},
            @{start_x=220;start_y=90;end_x=280;end_y=90;expected_normalized=1.0},
            @{start_x=280;start_y=90;end_x=40;end_y=90;expected_normalized=0.0}
          )
          New-Item -ItemType Directory -Force build/p52 | Out-Null
          foreach ($variant in @('Good','Bad')) {
            $plugins = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_GUI_Analog$variant.vst3")
            if ($plugins.Count -ne 1) { throw "Missing $variant plugin bundle" }
            $dll = @(Get-ChildItem $plugins[0].FullName -Recurse -File -Filter '*.vst3')
            if ($dll.Count -ne 1) { throw "Ambiguous $variant VST3 module" }
            $manifest = @{
              schema = '125a-gui-gesture-sweep-v1'
              product = @{
                binary = $dll[0].FullName
                sha256 = (Get-FileHash $dll[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              gui_host = $hostExe[0].FullName
              param_id = 9001
              initial_normalized = 0.0
              checkpoints = $checkpoints
            }
            $contract = "build/p52/$variant-contract.json"
            $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $contract
            python tests/run_gui_gesture_sweep.py --manifest $contract --out "build/p52/$variant"
            $exitCode = $LASTEXITCODE
            $report = Get-Content "build/p52/$variant/GUI-GESTURE-SWEEP-RESULT.json" -Raw | ConvertFrom-Json
            if ($variant -eq 'Good') {
              if ($exitCode -ne 0 -or $report.status -ne 'CONTRACT_PASS' -or $report.verified_checkpoints -ne 5 -or $report.release_approved -ne $false) {
                throw 'Good continuous control did not pass all 5 independently expected values'
              }
            } else {
              if ($exitCode -ne 1 -or $report.status -ne 'FAIL' -or $report.verified_checkpoints -ne 0 -or $report.faults.Count -lt 1) {
                throw 'Deliberately quantized control was not independently rejected'
              }
              $native = Get-Content "build/p52/$variant/native/native-workflow.tsv" -Raw
              if ($native -notmatch 'FAIL') { throw 'Fault fixture rejected for wrong reason' }
            }
          }
          Write-Host '[PASS] P52 real analog intermediate values plus deliberately quantized negative fixture'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P52-real-analog-Win32-VST3-positive-negative
          path: build/p52/
          if-no-files-found: warn
