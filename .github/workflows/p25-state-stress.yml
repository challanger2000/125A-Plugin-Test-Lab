name: P25 Universal VST3 State Playback and Sample Rate Stress

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/state_stress.cpp'
      - 'tests/state_race_fixture.cpp'
      - 'tests/verify_state_stress.py'
      - '.github/workflows/p25-state-stress.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p25-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal-real-vst3-state-stress:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record exact test-lab source and OS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/P25 | Out-Null
          "test_lab_sha=$env:GITHUB_SHA" | Set-Content artifacts/P25/RUN-METADATA.txt
          "runner_os=$env:RUNNER_OS" | Add-Content artifacts/P25/RUN-METADATA.txt
          "image=windows-2022" | Add-Content artifacts/P25/RUN-METADATA.txt
          "compiler=MSVC 2022 x64; C++23" | Add-Content artifacts/P25/RUN-METADATA.txt
          "fixture=source-built VST3 positive and negative, not product plugin" | Add-Content artifacts/P25/RUN-METADATA.txt
      - name: Configure Windows x64 with pinned VST3 SDK
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build universal live VST3 host and four instrumented fixtures
        shell: pwsh
        run: |
          cmake --build build --config Release --target TestLabStateStress QAStateMode0 QAStateMode1 QAStateMode2 QAStateMode3 --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'P25 VST3 host or fixtures compilation failed' }
      - name: P25 concurrent VST3 process/state saves and semantic snapshot oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          $plugin = @{}
          foreach ($i in @(0,1,2,3)) {
            $items = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_State_$i.vst3")
            if ($items.Count -lt 1) { throw "P25 missing state fixture $i" }
            $plugin["$i"] = $items[0].FullName
          }
          if ($hostExe.Count -ne 1) { throw 'P25 stress host missing or ambiguous' }
          $exe = $hostExe[0].FullName
          $matrix = @(
            @{id='good-44100-64';mode='0';rate=44100;block=64;oracle='paired';expect='good-paired';exit=0},
            @{id='good-48000-17';mode='0';rate=48000;block=17;oracle='paired';expect='good-paired';exit=0},
            @{id='good-96000-512';mode='0';rate=96000;block=512;oracle='paired';expect='good-paired';exit=0},
            @{id='rate-44100';mode='0';rate=44100;block=127;oracle='ramp';expect='good-ramp';exit=0},
            @{id='rate-48000';mode='0';rate=48000;block=64;oracle='ramp';expect='good-ramp';exit=0},
            @{id='rate-96000';mode='0';rate=96000;block=17;oracle='ramp';expect='good-ramp';exit=0},
            @{id='good-save-only';mode='0';rate=44100;block=64;oracle='paired';expect='good-paired';exit=0;saveOnly=$true},
            @{id='bad-save-only';mode='2';rate=44100;block=64;oracle='paired';expect='bad-save';exit=1;saveOnly=$true},
            @{id='bad-torn';mode='1';rate=44100;block=64;oracle='paired';expect='bad-torn';exit=1},
            @{id='bad-save';mode='2';rate=44100;block=64;oracle='paired';expect='bad-save';exit=1},
            @{id='bad-rate';mode='3';rate=96000;block=127;oracle='ramp';expect='bad-rate';exit=1}
          )
          foreach ($case in $matrix) {
            $report = "artifacts/P25/$($case.id).tsv"
            $stressArgs = @('--stress', $plugin[$case.mode], $report, $case.rate, $case.block, 2500, $case.oracle)
            if ($case.saveOnly) { $stressArgs += '--save-only' }
            & $exe @stressArgs 2>&1 |
              Tee-Object -FilePath "artifacts/P25/$($case.id).log"
            $rc = $LASTEXITCODE
            if ($rc -ne $case.exit) {
              throw "P25 $($case.id): expected exit $($case.exit) received $rc"
            }
            python tests/verify_state_stress.py $report $case.expect
            if ($LASTEXITCODE -ne 0) {
              throw "P25 independent semantic oracle failed: $($case.id)"
            }
          }
          Write-Host '[PASS] P25 eleven real VST3 concurrent playback/state and sample-rate cases, including three deliberate defects'
          exit 0
      - name: Publish proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Universal-VST3-State-Stress-P25
          path: artifacts/P25/
          if-no-files-found: warn
          retention-days: 14
