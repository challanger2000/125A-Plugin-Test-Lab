name: P25 Universal VST3 State Playback and Sample Rate Stress

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/state_stress.cpp'
      - 'tests/state_race_fixture.cpp'
      - 'tests/verify_state_stress.py'
      - 'src/state_recovery.cpp'
      - 'tests/make_recovery_fixtures.py'
      - 'tests/verify_recovery_adapter.py'
      - 'src/rate_block.cpp'
      - 'tests/verify_rate_block.py'
      - '.github/workflows/p25-state-stress.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p25-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal-real-vst3-state-stress:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record exact test-lab source and OS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/P25 | Out-Null
          "test_lab_sha=$env:GITHUB_SHA" | Set-Content artifacts/P25/RUN-METADATA.txt
          "runner_os=$env:RUNNER_OS" | Add-Content artifacts/P25/RUN-METADATA.txt
          "image=windows-2022" | Add-Content artifacts/P25/RUN-METADATA.txt
          "compiler=MSVC 2022 x64; C++23" | Add-Content artifacts/P25/RUN-METADATA.txt
          "fixture=source-built VST3 positive and negative, not product plugin" | Add-Content artifacts/P25/RUN-METADATA.txt
      - name: Configure Windows x64 with pinned VST3 SDK
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build universal live VST3 host and four instrumented fixtures
        shell: pwsh
        run: |
          cmake --build build --config Release --target TestLabStateStress TestLabRecovery TestLabRateBlock QAStateMode0 QAStateMode1 QAStateMode2 QAStateMode3 QAStateMode4 QAStateMode5 QAStateMode6 QAStateMode7 --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'P25 VST3 host or fixtures compilation failed' }
      - name: P25 concurrent VST3 process/state saves and semantic snapshot oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          $plugin = @{}
          foreach ($i in @(0,1,2,3)) {
            $items = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_State_$i.vst3")
            if ($items.Count -lt 1) { throw "P25 missing state fixture $i" }
            $plugin["$i"] = $items[0].FullName
          }
          if ($hostExe.Count -ne 1) { throw 'P25 stress host missing or ambiguous' }
          $exe = $hostExe[0].FullName
          $matrix = @(
            @{id='good-44100-64';mode='0';rate=44100;block=64;oracle='paired';expect='good-paired';exit=0},
            @{id='good-48000-17';mode='0';rate=48000;block=17;oracle='paired';expect='good-paired';exit=0},
            @{id='good-96000-512';mode='0';rate=96000;block=512;oracle='paired';expect='good-paired';exit=0},
            @{id='rate-44100';mode='0';rate=44100;block=127;oracle='ramp';expect='good-ramp';exit=0},
            @{id='rate-48000';mode='0';rate=48000;block=64;oracle='ramp';expect='good-ramp';exit=0},
            @{id='rate-96000';mode='0';rate=96000;block=17;oracle='ramp';expect='good-ramp';exit=0},
            @{id='good-save-only';mode='0';rate=44100;block=64;oracle='paired';expect='good-paired';exit=0;saveOnly=$true},
            @{id='bad-save-only';mode='2';rate=44100;block=64;oracle='paired';expect='bad-save';exit=1;saveOnly=$true},
            @{id='bad-torn';mode='1';rate=44100;block=64;oracle='paired';expect='bad-torn';exit=1},
            @{id='bad-save';mode='2';rate=44100;block=64;oracle='paired';expect='bad-save';exit=1},
            @{id='bad-rate';mode='3';rate=96000;block=127;oracle='ramp';expect='bad-rate';exit=1}
          )
          foreach ($case in $matrix) {
            $report = "artifacts/P25/$($case.id).tsv"
            $stressArgs = @('--stress', $plugin[$case.mode], $report, $case.rate, $case.block, 2500, $case.oracle)
            if ($case.saveOnly) { $stressArgs += '--save-only' }
            & $exe @stressArgs 2>&1 |
              Tee-Object -FilePath "artifacts/P25/$($case.id).log"
            $rc = $LASTEXITCODE
            if ($rc -ne $case.exit) {
              throw "P25 $($case.id): expected exit $($case.exit) received $rc"
            }
            python tests/verify_state_stress.py $report $case.expect
            if ($LASTEXITCODE -ne 0) {
              throw "P25 independent semantic oracle failed: $($case.id)"
            }
          }
          Write-Host '[PASS] P25 eleven real VST3 concurrent playback/state and sample-rate cases, including three deliberate defects'
          exit 0
      - name: P26 real VST3 state rejection, rollback, recovery, independent PCM adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Recovery.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_4.vst3')
          $broken = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_5.vst3')
          if ($hostExe.Count -ne 1 -or $good.Count -lt 1 -or $broken.Count -lt 1) {
            throw 'P26 generic recovery host or VST3 fixtures missing'
          }
          $exe = $hostExe[0].FullName
          python tests/make_recovery_fixtures.py artifacts/P26/fixtures
          if ($LASTEXITCODE -ne 0) { throw 'P26 cannot generate independent state oracle fixtures' }
          $src = 'artifacts/P26/fixtures'
          $a = "$src/A.bin"; $b = "$src/B.bin"; $invalid = "$src/invalid.bin"
          & $exe --recover $good[0].FullName $a $b $invalid artifacts/P26/good 2>&1 |
            Tee-Object -FilePath artifacts/P26/good.log
          if ($LASTEXITCODE -ne 0) { throw 'P26 real valid VST3 recovery scenario failed' }
          python tests/verify_recovery_adapter.py "$src/adapter.json" artifacts/P26/good 2>&1 |
            Tee-Object -FilePath artifacts/P26/good-oracle.log
          if ($LASTEXITCODE -ne 0) { throw 'P26 positive independent state+PCM recovery oracle failed' }
          & $exe --recover $broken[0].FullName $a $b $invalid artifacts/P26/broken 2>&1 |
            Tee-Object -FilePath artifacts/P26/broken.log
          if ($LASTEXITCODE -ne 0) { throw 'P26 broken fixture did not execute complete API lifecycle' }
          python tests/verify_recovery_adapter.py "$src/adapter.json" artifacts/P26/broken 2>&1 |
            Tee-Object -FilePath artifacts/P26/broken-oracle.log
          if ($LASTEXITCODE -ne 1) { throw 'P26 failed to detect deliberately corrupted rollback' }
          $badLog = Get-Content artifacts/P26/broken-oracle.log -Raw
          if (-not $badLog.Contains('state-after-error.bin')) {
            throw 'P26 broken fixture rejected for unrelated reason'
          }
          Write-Host '[PASS] P26 real invalid state rejection, transactional rollback, recovery and PCM; defective VST3 independently detected'
          exit 0

      - name: P27 independent 44.1/48/96-kHz and host-block partition PCM validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Rate_Block.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_0.vst3')
          $badRate = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_3.vst3')
          $badBlock = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_6.vst3')
          if ($hostExe.Count -ne 1 -or $good.Count -lt 1 -or
              $badRate.Count -lt 1 -or $badBlock.Count -lt 1) {
            throw 'P27 native VST3 PCM recorder or fixtures missing'
          }
          $exe = $hostExe[0].FullName
          New-Item -ItemType Directory -Force artifacts/P27 | Out-Null
          foreach ($rate in @(44100,48000,96000)) {
            foreach ($block in @(17,127,512)) {
              $out = "artifacts/P27/good-$rate-$block.f32"
              & $exe --pcm $good[0].FullName $out $rate $block 2>&1 |
                Tee-Object -FilePath "artifacts/P27/good-$rate-$block.log"
              if ($LASTEXITCODE -ne 0) { throw "P27 good VST3 crashed or failed $rate/$block" }
            }
          }
          python tests/verify_rate_block.py good artifacts/P27 artifacts/P27/MATRIX-RESULT.json
          if ($LASTEXITCODE -ne 0) { throw 'P27 independent good VST3 time/partition oracle failed' }
          & $exe --pcm $badRate[0].FullName artifacts/P27/bad-rate-96000.f32 96000 127 2>&1 |
            Tee-Object -FilePath artifacts/P27/bad-rate-host.log
          if ($LASTEXITCODE -ne 0) { throw 'P27 broken sample-rate fixture failed to generate PCM' }
          python tests/verify_rate_block.py single artifacts/P27/bad-rate-96000.f32 96000 2>&1 |
            Tee-Object -FilePath artifacts/P27/bad-rate-oracle.log
          if ($LASTEXITCODE -ne 1) { throw 'P27 broken host-rate DSP was not detected' }
          if (-not (Get-Content artifacts/P27/bad-rate-oracle.log -Raw).Contains('time-ramp mismatch')) {
            throw 'P27 broken sample-rate fixture rejected for unrelated reason'
          }
          foreach ($block in @(17,512)) {
            & $exe --pcm $badBlock[0].FullName "artifacts/P27/bad-block-$block.f32" 44100 $block 2>&1 |
              Tee-Object -FilePath "artifacts/P27/bad-block-$block.log"
            if ($LASTEXITCODE -ne 0) { throw 'P27 broken host-block fixture did not generate PCM' }
          }
          python tests/verify_rate_block.py compare artifacts/P27/bad-block-17.f32 artifacts/P27/bad-block-512.f32 44100 2>&1 |
            Tee-Object -FilePath artifacts/P27/bad-block-oracle.log
          if ($LASTEXITCODE -ne 1) { throw 'P27 host-block-dependent DSP was not detected' }
          if (-not (Get-Content artifacts/P27/bad-block-oracle.log -Raw).Contains('block partition mismatch')) {
            throw 'P27 broken block fixture rejected for unrelated reason'
          }
          Write-Host '[PASS] P27 9 positive true VST3 PCM matrix cases plus both negative DSP defects'
          exit 0

      - name: P28 strict realtime callback deadline with blocking VST3 negative control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_0.vst3')
          $broken = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_7.vst3')
          if ($exe.Count -ne 1 -or $good.Count -lt 1 -or $broken.Count -lt 1) {
            throw 'P28 real VST3 stress host or blocking negative fixture missing'
          }
          New-Item -ItemType Directory -Force artifacts/P28 | Out-Null
          & $exe[0].FullName --stress $good[0].FullName artifacts/P28/good.tsv 44100 1024 2500 paired --save-only --rt-deadline 2>&1 |
            Tee-Object -FilePath artifacts/P28/good.log
          if ($LASTEXITCODE -ne 0) { throw 'P28 valid VST3 exceeded realtime callback deadline' }
          python tests/verify_state_stress.py artifacts/P28/good.tsv good-realtime
          if ($LASTEXITCODE -ne 0) { throw 'P28 independent good realtime statistics missing or invalid' }
          & $exe[0].FullName --stress $broken[0].FullName artifacts/P28/broken.tsv 44100 1024 2500 paired --save-only --rt-deadline 2>&1 |
            Tee-Object -FilePath artifacts/P28/broken.log
          if ($LASTEXITCODE -ne 1) { throw 'P28 blocking plugin did not trigger strict deadline FAIL' }
          python tests/verify_state_stress.py artifacts/P28/broken.tsv bad-realtime
          if ($LASTEXITCODE -ne 0) { throw 'P28 independent oracle did not confirm deliberate callback deadline overruns' }
          Write-Host '[PASS] P28 real callback p95/p99/max and hard realtime deadline; broken VST3 blocked > deadline'
          exit 0

      - name: Publish proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Universal-VST3-State-Stress-P25
          path: |
            artifacts/P25/
            artifacts/P26/
            artifacts/P27/
            artifacts/P28/
          if-no-files-found: warn
          retention-days: 14
