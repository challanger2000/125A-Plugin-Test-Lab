            throw 'P42 native real Win32 VST3 GUI/sham/hover fixtures missing'
          }
          New-Item -ItemType Directory -Force artifacts/P41 | Out-Null
          foreach ($fixture in @(
            @{name='interactive';plugin=$good[0].FullName;expected='PARAMETER_AND_VISUAL_CHANGE';candidate=1;attribution='SUPPORTED'},
            @{name='inert';plugin=$inert[0].FullName;expected='NO_OBSERVED_CHANGE';candidate=0;attribution='SUPPORTED'},
            @{name='stale-paint';plugin=$stale[0].FullName;expected='PARAMETER_CHANGE';candidate=1;attribution='SUPPORTED'},
            @{name='hover';plugin=$hover[0].FullName;expected='NO_OBSERVED_CHANGE';candidate=0;attribution='SUPPORTED'}
          )) {
            python tests/run_gui_exploration.py --plugin $fixture.plugin --gui-host $gui[0].FullName --out "artifacts/P41/$($fixture.name)" --points "160,90" --acknowledge-ui-clicks --timeout 30
            if ($LASTEXITCODE -ne 0) { throw "P41 actual GUI exploration failed: $($fixture.name)" }
            $result = Get-Content "artifacts/P41/$($fixture.name)/GUI-EXPLORATION-RESULT.json" -Raw | ConvertFrom-Json
            if ($result.status -ne 'OBSERVATIONS_COMPLETE' -or
                $result.requested_points -ne 1 -or $result.completed_points -ne 1 -or
                $result.sham_verified_points -ne 1 -or $result.sham_control -ne 'COMPLETE' -or
                $result.probes[0].sham_control_attribution -ne $fixture.attribution -or
                @($result.probes).Count -ne 1 -or
                $result.probes[0].classification -ne $fixture.expected -or
                @($result.candidates).Count -ne $fixture.candidate -or
                $result.gui_control_discovery -ne 'OBSERVATIONS_ONLY' -or
                $result.product_gui_controls -ne 'NOT COVERED' -or
                $result.release_approved -ne $false) {
              throw "P41 misclassified real GUI observation: $($fixture.name)"
            }
          }
          # Also verify autonomous selection of a grid with no product profile.
          python tests/run_gui_exploration.py --plugin $good[0].FullName --gui-host $gui[0].FullName --out artifacts/P41/automatic-grid --max-points 3 --acknowledge-ui-clicks --timeout 30
          if ($LASTEXITCODE -ne 0) { throw 'P41 automatic UI grid failed on real native VST3' }
          $grid = Get-Content artifacts/P41/automatic-grid/GUI-EXPLORATION-RESULT.json -Raw | ConvertFrom-Json
          if ($grid.status -ne 'OBSERVATIONS_COMPLETE' -or
              $grid.completed_points -ne 3 -or $grid.sham_verified_points -ne 3 -or
              $grid.sham_control -ne 'COMPLETE' -or @($grid.candidates).Count -ne 3) {
            throw 'P41 default autonomous GUI probing did not observe three genuine actions'
          }
          $hoverReport = Get-Content artifacts/P41/hover/GUI-EXPLORATION-RESULT.json -Raw | ConvertFrom-Json
          if ($hoverReport.probes[0].sham_pixels_changed -ne 0 -or
              @($hoverReport.probes[0].changed_parameters).Count -ne 0 -or
              $hoverReport.probes[0].classification -ne 'NO_OBSERVED_CHANGE') {
            throw 'P43 hover-stabilized baseline misclassified mouseover as click behavior'
          }
          Write-Host '[PASS] P42 genuine click/sham Windows VST3s reject inert, stale and hover-only false-positive controls'
          exit 0

      - name: P43 real nested Win32 BUTTON targeting, sham pairing and persistent workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gui = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $nested = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Nested.vst3')
          if ($gui.Count -ne 1 -or $nested.Count -ne 1) {
            throw 'P43 real native Win32 child-button test plugin or host missing'
          }
          New-Item -ItemType Directory -Force artifacts/P43 | Out-Null
          $plugin = $nested[0].FullName
          # This x,y is INSIDE the genuine Win32 button nested inside
          # the editor's custom HWND. Sending directly to the editor root
          # produces no parameter changes by deliberate fixture design.
          python tests/run_gui_exploration.py --plugin $plugin --gui-host $gui[0].FullName --out artifacts/P43/nested-actual --points "160,90" --acknowledge-ui-clicks --timeout 30
          if ($LASTEXITCODE -ne 0) { throw 'P43 native button click failed' }
          $observed = Get-Content artifacts/P43/nested-actual/GUI-EXPLORATION-RESULT.json -Raw | ConvertFrom-Json
          if ($observed.status -ne 'OBSERVATIONS_COMPLETE' -or
              $observed.sham_control -ne 'COMPLETE' -or
              $observed.sham_verified_points -ne 1 -or
              $observed.probes[0].native_child_depth -lt 1 -or
              $observed.probes[0].sham_control_attribution -ne 'SUPPORTED' -or
              $observed.probes[0].classification -notin @('PARAMETER_AND_VISUAL_CHANGE','PARAMETER_CHANGE') -or
              @($observed.probes[0].changed_parameters).Count -ne 1 -or
              $observed.probes[0].changed_parameters[0].param_id -ne 9001 -or
              @($observed.candidates).Count -ne 1 -or
              $observed.product_gui_controls -ne 'NOT COVERED') {
            throw 'P43 real nested child HWND was not reached or attribution was forged'
          }
          # A click on the editor background must NOT trigger the nested button.
          python tests/run_gui_exploration.py --plugin $plugin --gui-host $gui[0].FullName --out artifacts/P43/nested-outside --points "20,20" --acknowledge-ui-clicks --timeout 30
          if ($LASTEXITCODE -ne 0) { throw 'P43 outside native child hit probe failed' }
          $outside = Get-Content artifacts/P43/nested-outside/GUI-EXPLORATION-RESULT.json -Raw | ConvertFrom-Json
          if ($outside.status -ne 'OBSERVATIONS_COMPLETE' -or
              $outside.probes[0].native_child_depth -ne 0 -or
              $outside.probes[0].classification -ne 'NO_OBSERVED_CHANGE' -or
              @($outside.candidates).Count -ne 0) {
            throw 'P43 root click falsely activated a nested child button'
          }
          # Same actual editor instance: each of two native nested button
          # clicks must independently toggle the exposed controller value.
          $module = @(Get-ChildItem $plugin -Recurse -File -Filter '*.vst3')
          if ($module.Count -ne 1) { throw 'P43 ambiguous source-built binary' }
          $profile = @{
            schema='125a-gui-workflow-v1'
            product=@{binary=$module[0].FullName;sha256=(Get-FileHash $module[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            gui_host=$gui[0].FullName
            initial=@(@{param_id=9001;normalized=0.0})
            steps=@(
              @{id='nested_on';action='click';x=160;y=90;param_id=9001;before_normalized=0.0;expected_normalized=1.0},
              @{id='nested_off';action='click';x=160;y=90;param_id=9001;before_normalized=1.0;expected_normalized=0.0}
            )
          }
          $profile | ConvertTo-Json -Depth 12 | Set-Content artifacts/P43/nested-workflow.json
          python tests/run_gui_workflow.py --manifest artifacts/P43/nested-workflow.json --out artifacts/P43/sequence
          if ($LASTEXITCODE -ne 0) { throw 'P43 actual nested child HWND two-way click failed' }
          $seq = Get-Content artifacts/P43/sequence/GUI-WORKFLOW-RESULT.json -Raw | ConvertFrom-Json
          if ($seq.status -ne 'TECHNICAL_PASS' -or $seq.verified_actions -ne 2 -or
              $seq.controller_action_chain -ne 'PASS' -or
              $seq.product_gui_complete -ne 'NOT COVERED') {
            throw 'P43 nested two-way native click created false successful evidence'
          }
          Write-Host '[PASS] P43 real nested VST3 child button detected, hit, and toggled ON/OFF; background clicks and false UI coverage rejected'
          exit 0

      - name: One-command real VST3 quickcheck without handwritten manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/test_plugin_quickcheck.py
          if ($LASTEXITCODE -ne 0) { throw 'Quickcheck identity and stale-evidence negative controls failed' }
          $audio = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $stress = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_0.vst3')
          $dual = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Instance_Isolation.exe')
          if ($audio.Count -ne 1 -or $stress.Count -ne 1 -or $dual.Count -ne 1 -or $good.Count -lt 1) {
            throw 'Quickcheck native host or VST3 fixture missing'
          }
          python tests/run_plugin_quickcheck.py --plugin $good[0].FullName --host $audio[0].FullName --stress-host $stress[0].FullName --dual-host $dual[0].FullName --out artifacts/QUICKCHECK
          if ($LASTEXITCODE -ne 0) { throw 'Actual real VST3 one-command test failed' }
          $report = Get-Content artifacts/QUICKCHECK/QUICKCHECK-RESULT.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'TECHNICAL_PASS' -or $report.release_approved -ne $false -or
              $report.coverage.product_gui_controls -ne 'NOT COVERED' -or
              $report.coverage.api_playback_save -ne 'PASS' -or
              $report.coverage.fresh_process_project_recall -ne 'PASS' -or
              $report.coverage.same_process_dual_instance_lifecycle -ne 'PASS' -or
              $report.coverage.distinct_instance_state_isolation -ne 'NOT COVERED' -or
              $report.coverage.recall_audio_determinism -ne 'NOT COVERED' -or
              $report.coverage.realtime_deadline_observation -notin @('PASS','FAIL')) {
            throw 'Quickcheck coverage or release classification incorrect'
          }
          # Verify that both optional advanced paths are integrated into
          # the same one-command wrapper with *actual* native VST3s.
          python tests/run_plugin_quickcheck.py --plugin $good[0].FullName --host $audio[0].FullName --stress-host $stress[0].FullName --dual-host $dual[0].FullName --active-replay --out artifacts/QUICKCHECK-DEEP
          if ($LASTEXITCODE -ne 0) { throw 'Real one-command genuine live state replay failed' }
          $deep = Get-Content artifacts/QUICKCHECK-DEEP/QUICKCHECK-RESULT.json -Raw | ConvertFrom-Json
          if ($deep.status -ne 'TECHNICAL_PASS' -or
              $deep.coverage.active_playback_state_replay -ne 'PASS' -or
              $deep.coverage.distinct_instance_state_isolation -ne 'NOT COVERED' -or
              $deep.release_approved -ne $false) {
            throw 'Live-playback replay was not actually verified by the complete quickcheck'
          }
          $approved = 'artifacts/INSTANCE/qa-good.json'
          $banked = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_4.vst3')
          if ($banked.Count -ne 1 -or -not (Test-Path $approved)) {
            throw 'Missing real VST3 or previously approved independent A/B manifest'
          }
          python tests/run_plugin_quickcheck.py --plugin $banked[0].FullName --host $audio[0].FullName --stress-host $stress[0].FullName --dual-host $dual[0].FullName --dual-state-manifest $approved --out artifacts/QUICKCHECK-AB
          if ($LASTEXITCODE -ne 0) { throw 'Real one-command independent two-bank oracle failed' }
          $dualProduct = Get-Content artifacts/QUICKCHECK-AB/QUICKCHECK-RESULT.json -Raw | ConvertFrom-Json
          if ($dualProduct.status -ne 'TECHNICAL_PASS' -or
              $dualProduct.coverage.distinct_instance_state_isolation -ne 'PASS' -or
              $dualProduct.coverage.reference_pcm_isolation -ne 'PASS' -or
              $dualProduct.coverage.commercial_daw_integration -ne 'NOT COVERED' -or
              $dualProduct.release_approved -ne $false) {
            throw 'Independent A/B product oracles missing or false product release classification'
          }
          $gui = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $click = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Click.vst3')
          if ($gui.Count -ne 1 -or $click.Count -lt 1) { throw 'Portable GUI host or real GUI fixture missing' }
          & $gui[0].FullName --inventory-parameters $click[0].FullName artifacts/QUICKCHECK/native-gui-parameters.tsv
          if ($LASTEXITCODE -ne 0) { throw 'Genuine Windows VST3 parameter discovery failed' }
          python tests/verify_parameter_inventory.py --inventory artifacts/QUICKCHECK/native-gui-parameters.tsv --out artifacts/QUICKCHECK/native-gui-parameters
          if ($LASTEXITCODE -ne 0) { throw 'Independent native parameter inventory audit failed' }
          & $gui[0].FullName --probe $click[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Portable native GUI probe failed to attach/detach real VST3 editor' }
          $deadlineProof = Get-Content artifacts/QUICKCHECK/native/P32/ADAPTER-RESULT.json -Raw | ConvertFrom-Json
          if ($deadlineProof.cases.Count -ne 6 -or
              @($deadlineProof.cases | Where-Object {
                $_.realtime_certification -notin @('PASS','FAIL') -or
                $null -eq $_.timing.callback_overruns -or
                $null -eq $_.timing.callback_p99_ns -or
                $null -eq $_.timing.callback_deadline_ns
              }).Count -ne 0) {
            throw 'Native audio deadline report incomplete; realtime PASS would be ungrounded'
          }
          Write-Host '[PASS] One command exercises actual VST3 playback-save, PCM/state and real callback timing evidence'
          exit 0

      - name: Stage portable one-command Windows VST3 quickcheck kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'artifacts/PORTABLE'
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($binaryName in @('125A_Test_Lab_Host.exe','125A_Test_Lab_State_Stress.exe','125A_Test_Lab_GUI.exe','125A_Test_Lab_Instance_Isolation.exe')) {
            $found = @(Get-ChildItem build -Recurse -File -Filter $binaryName)
            if ($found.Count -ne 1) { throw "Portable Test Lab host missing: $binaryName" }
            Copy-Item -LiteralPath $found[0].FullName -Destination "$dir/$binaryName"
          }
          foreach ($script in @('run_plugin_quickcheck.py','run_product_qa.py','run_product_adapter.py','run_p34_capture.py','run_gui_control_matrix.py','run_gui_workflow.py','run_gui_exploration.py','verify_p33_artifacts.py','run_state_reload.py','write_user_report.py','verify_instance_isolation.py','verify_multi_instance_smoke.py','run_product_dual_state.py','run_live_state_replay.py','verify_state_stress.py','verify_audio_reference.py','verify_parameter_inventory.py','verify_parameter_sweep.py','verify_parameter_text.py')) {
            if (-not (Test-Path "tests/$script")) { throw "Portable QA script missing: $script" }
            Copy-Item -LiteralPath "tests/$script" -Destination "$dir/$script"
          }
          Copy-Item tests/Run-VST3-Test.cmd "$dir/Run-VST3-Test.cmd"
          Copy-Item docs/ONE-COMMAND-QUICKCHECK.md "$dir/README.md"
          python -m py_compile "$dir/run_plugin_quickcheck.py" "$dir/run_product_qa.py" "$dir/run_product_adapter.py" "$dir/run_p34_capture.py" "$dir/run_gui_control_matrix.py" "$dir/run_gui_workflow.py" "$dir/run_gui_exploration.py" "$dir/verify_p33_artifacts.py" "$dir/run_state_reload.py" "$dir/write_user_report.py" "$dir/verify_instance_isolation.py" "$dir/verify_multi_instance_smoke.py" "$dir/run_product_dual_state.py" "$dir/run_live_state_replay.py" "$dir/verify_state_stress.py" "$dir/verify_audio_reference.py" "$dir/verify_parameter_inventory.py" "$dir/verify_parameter_sweep.py" "$dir/verify_parameter_text.py"
          if ($LASTEXITCODE -ne 0) { throw 'Portable Python scripts syntax check failed' }
          python tests/test_user_report.py
          if ($LASTEXITCODE -ne 0) { throw 'German results/report mutation controls failed' }
          python "$dir/write_user_report.py" --result artifacts/QUICKCHECK/QUICKCHECK-RESULT.json --out artifacts/PORTABLE/TESTERGEBNIS.html
          if ($LASTEXITCODE -ne 0) { throw 'Could not render actual native VST3 user report' }
          $page = Get-Content "$dir/TESTERGEBNIS.html" -Raw
          if (-not ($page.Contains('Technische Pruefungen bestanden') -and
                    $page.Contains('KEINE PRODUKTFREIGABE') -and
                    $page.Contains('NICHT GEPRUEFT'))) {
            throw 'User report asserts false product release readiness'
          }
          $launcherText = Get-Content "$dir/Run-VST3-Test.cmd" -Raw
          if (-not $launcherText.Contains('run_plugin_quickcheck.py') -or
              -not $launcherText.Contains('--gui-host')) {
            throw 'Portable Windows launcher does not invoke the combined audio/GUI quickcheck'
          }
          $env:CI = 'true'
          & "$dir/Run-VST3-Test.cmd"
          if ($LASTEXITCODE -ne 2) { throw 'Windows launcher without a VST3 accepted empty input' }
          $env:CI = $null
          Get-ChildItem $dir -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "$dir/SHA256.txt"
          Write-Host '[PASS] Portable Windows native host and scripts staged with SHA256 fingerprints'
          exit 0

