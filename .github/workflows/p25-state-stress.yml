name: P25 Universal VST3 State Playback and Sample Rate Stress

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/state_stress.cpp'
      - 'tests/state_race_fixture.cpp'
      - 'tests/verify_state_stress.py'
      - 'src/state_recovery.cpp'
      - 'tests/make_recovery_fixtures.py'
      - 'tests/verify_recovery_adapter.py'
      - 'src/rate_block.cpp'
      - 'tests/verify_rate_block.py'
      - 'src/controller_recovery.cpp'
      - 'tests/controller_recovery_fixture.cpp'
      - 'tests/verify_controller_recovery.py'
      - 'src/gui_recovery.cpp'
      - 'tests/gui_recovery_fixture.cpp'
      - 'tests/verify_gui_recovery.py'
      - 'tests/run_product_adapter.py'
      - 'tests/test_p32_stale_evidence.py'
      - 'tests/test_playback_save_overlap.py'
      - 'tests/verify_p33_artifacts.py'
      - 'tests/test_p33_artifacts.py'
      - 'tests/verify_product_acceptance.py'
      - 'tests/test_product_acceptance.py'
      - 'tests/run_product_qa.py'
      - 'tests/run_plugin_quickcheck.py'
      - 'tests/verify_parameter_inventory.py'
      - 'tests/write_user_report.py'
      - 'tests/test_user_report.py'
      - 'tests/Run-VST3-Test.cmd'
      - 'tests/run_gui_control_matrix.py'
      - 'tests/test_plugin_quickcheck.py'
      - 'tests/test_audio_reference.py'
      - 'tests/verify_audio_reference.py'
      - 'docs/PRODUCT-USER-ACCEPTANCE.md'
      - 'tests/run_p34_capture.py'
      - 'tests/run_state_reload.py'
      - 'tests/test_state_reload.py'
      - 'tests/make_p34_capture_manifest.py'
      - 'tests/test_p34_capture.py'
      - 'src/main.cpp'
      - 'tests/make_p32_fixtures.py'
      - '.github/workflows/p25-state-stress.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p25-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal-real-vst3-state-stress:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record exact test-lab source and OS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/P25 | Out-Null
          "test_lab_sha=$env:GITHUB_SHA" | Set-Content artifacts/P25/RUN-METADATA.txt
          "runner_os=$env:RUNNER_OS" | Add-Content artifacts/P25/RUN-METADATA.txt
          "image=windows-2022" | Add-Content artifacts/P25/RUN-METADATA.txt
          "compiler=MSVC 2022 x64; C++23" | Add-Content artifacts/P25/RUN-METADATA.txt
          "fixture=source-built VST3 positive and negative, not product plugin" | Add-Content artifacts/P25/RUN-METADATA.txt
      - name: Configure Windows x64 with pinned VST3 SDK
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build universal live VST3 host and four instrumented fixtures
        shell: pwsh
        run: |
          cmake --build build --config Release --target TestLabHost TestLabGUI QAGuiClick TestLabStateStress TestLabRecovery TestLabRateBlock QAStateMode0 QAStateMode1 QAStateMode2 QAStateMode3 QAStateMode4 QAStateMode5 QAStateMode6 QAStateMode7 TestLabControllerRecovery QAControllerMode0 QAControllerMode1 TestLabGuiRecovery QAGuiRecoveryMode0 QAGuiRecoveryMode1 --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'P25 VST3 host or fixtures compilation failed' }
      - name: P25 concurrent VST3 process/state saves and semantic snapshot oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          $plugin = @{}
          foreach ($i in @(0,1,2,3)) {
            $items = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_State_$i.vst3")
            if ($items.Count -lt 1) { throw "P25 missing state fixture $i" }
            $plugin["$i"] = $items[0].FullName
          }
          if ($hostExe.Count -ne 1) { throw 'P25 stress host missing or ambiguous' }
          $exe = $hostExe[0].FullName
          $matrix = @(
            @{id='good-44100-64';mode='0';rate=44100;block=64;oracle='paired';expect='good-paired';exit=0},
            @{id='good-48000-17';mode='0';rate=48000;block=17;oracle='paired';expect='good-paired';exit=0},
            @{id='good-96000-512';mode='0';rate=96000;block=512;oracle='paired';expect='good-paired';exit=0},
            @{id='rate-44100';mode='0';rate=44100;block=127;oracle='ramp';expect='good-ramp';exit=0},
            @{id='rate-48000';mode='0';rate=48000;block=64;oracle='ramp';expect='good-ramp';exit=0},
            @{id='rate-96000';mode='0';rate=96000;block=17;oracle='ramp';expect='good-ramp';exit=0},
            @{id='good-save-only';mode='0';rate=44100;block=64;oracle='paired';expect='good-paired';exit=0;saveOnly=$true},
            @{id='bad-save-only';mode='2';rate=44100;block=64;oracle='paired';expect='bad-save';exit=1;saveOnly=$true},
            @{id='bad-torn';mode='1';rate=44100;block=64;oracle='paired';expect='bad-torn';exit=1},
            @{id='bad-save';mode='2';rate=44100;block=64;oracle='paired';expect='bad-save';exit=1},
            @{id='bad-rate';mode='3';rate=96000;block=127;oracle='ramp';expect='bad-rate';exit=1}
          )
          foreach ($case in $matrix) {
            $report = "artifacts/P25/$($case.id).tsv"
            $stressArgs = @('--stress', $plugin[$case.mode], $report, $case.rate, $case.block, 2500, $case.oracle)
            if ($case.saveOnly) { $stressArgs += '--save-only' }
            & $exe @stressArgs 2>&1 |
              Tee-Object -FilePath "artifacts/P25/$($case.id).log"
            $rc = $LASTEXITCODE
            if ($rc -ne $case.exit) {
              throw "P25 $($case.id): expected exit $($case.exit) received $rc"
            }
            python tests/verify_state_stress.py $report $case.expect
            if ($LASTEXITCODE -ne 0) {
              throw "P25 independent semantic oracle failed: $($case.id)"
            }
          }
          Write-Host '[PASS] P25 eleven real VST3 concurrent playback/state and sample-rate cases, including three deliberate defects'
          exit 0
      - name: P26 real VST3 state rejection, rollback, recovery, independent PCM adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Recovery.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_4.vst3')
          $broken = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_5.vst3')
          if ($hostExe.Count -ne 1 -or $good.Count -lt 1 -or $broken.Count -lt 1) {
            throw 'P26 generic recovery host or VST3 fixtures missing'
          }
          $exe = $hostExe[0].FullName
          python tests/make_recovery_fixtures.py artifacts/P26/fixtures
          if ($LASTEXITCODE -ne 0) { throw 'P26 cannot generate independent state oracle fixtures' }
          $src = 'artifacts/P26/fixtures'
          $a = "$src/A.bin"; $b = "$src/B.bin"; $invalid = "$src/invalid.bin"
          & $exe --recover $good[0].FullName $a $b $invalid artifacts/P26/good 2>&1 |
            Tee-Object -FilePath artifacts/P26/good.log
          if ($LASTEXITCODE -ne 0) { throw 'P26 real valid VST3 recovery scenario failed' }
          python tests/verify_recovery_adapter.py "$src/adapter.json" artifacts/P26/good 2>&1 |
            Tee-Object -FilePath artifacts/P26/good-oracle.log
          if ($LASTEXITCODE -ne 0) { throw 'P26 positive independent state+PCM recovery oracle failed' }
          & $exe --recover $broken[0].FullName $a $b $invalid artifacts/P26/broken 2>&1 |
            Tee-Object -FilePath artifacts/P26/broken.log
          if ($LASTEXITCODE -ne 0) { throw 'P26 broken fixture did not execute complete API lifecycle' }
          python tests/verify_recovery_adapter.py "$src/adapter.json" artifacts/P26/broken 2>&1 |
            Tee-Object -FilePath artifacts/P26/broken-oracle.log
          if ($LASTEXITCODE -ne 1) { throw 'P26 failed to detect deliberately corrupted rollback' }
          $badLog = Get-Content artifacts/P26/broken-oracle.log -Raw
          if (-not $badLog.Contains('state-after-error.bin')) {
            throw 'P26 broken fixture rejected for unrelated reason'
          }
          Write-Host '[PASS] P26 real invalid state rejection, transactional rollback, recovery and PCM; defective VST3 independently detected'
          exit 0

      - name: P27 independent 44.1/48/96-kHz and host-block partition PCM validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Rate_Block.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_0.vst3')
          $badRate = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_3.vst3')
          $badBlock = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_6.vst3')
          if ($hostExe.Count -ne 1 -or $good.Count -lt 1 -or
              $badRate.Count -lt 1 -or $badBlock.Count -lt 1) {
            throw 'P27 native VST3 PCM recorder or fixtures missing'
          }
          $exe = $hostExe[0].FullName
          New-Item -ItemType Directory -Force artifacts/P27 | Out-Null
          foreach ($rate in @(44100,48000,96000)) {
            foreach ($block in @(17,127,512)) {
              $out = "artifacts/P27/good-$rate-$block.f32"
              & $exe --pcm $good[0].FullName $out $rate $block 2>&1 |
                Tee-Object -FilePath "artifacts/P27/good-$rate-$block.log"
              if ($LASTEXITCODE -ne 0) { throw "P27 good VST3 crashed or failed $rate/$block" }
            }
          }
          python tests/verify_rate_block.py good artifacts/P27 artifacts/P27/MATRIX-RESULT.json
          if ($LASTEXITCODE -ne 0) { throw 'P27 independent good VST3 time/partition oracle failed' }
          & $exe --pcm $badRate[0].FullName artifacts/P27/bad-rate-96000.f32 96000 127 2>&1 |
            Tee-Object -FilePath artifacts/P27/bad-rate-host.log
          if ($LASTEXITCODE -ne 0) { throw 'P27 broken sample-rate fixture failed to generate PCM' }
          python tests/verify_rate_block.py single artifacts/P27/bad-rate-96000.f32 96000 2>&1 |
            Tee-Object -FilePath artifacts/P27/bad-rate-oracle.log
          if ($LASTEXITCODE -ne 1) { throw 'P27 broken host-rate DSP was not detected' }
          if (-not (Get-Content artifacts/P27/bad-rate-oracle.log -Raw).Contains('time-ramp mismatch')) {
            throw 'P27 broken sample-rate fixture rejected for unrelated reason'
          }
          foreach ($block in @(17,512)) {
            & $exe --pcm $badBlock[0].FullName "artifacts/P27/bad-block-$block.f32" 44100 $block 2>&1 |
              Tee-Object -FilePath "artifacts/P27/bad-block-$block.log"
            if ($LASTEXITCODE -ne 0) { throw 'P27 broken host-block fixture did not generate PCM' }
          }
          python tests/verify_rate_block.py compare artifacts/P27/bad-block-17.f32 artifacts/P27/bad-block-512.f32 44100 2>&1 |
            Tee-Object -FilePath artifacts/P27/bad-block-oracle.log
          if ($LASTEXITCODE -ne 1) { throw 'P27 host-block-dependent DSP was not detected' }
          if (-not (Get-Content artifacts/P27/bad-block-oracle.log -Raw).Contains('block partition mismatch')) {
            throw 'P27 broken block fixture rejected for unrelated reason'
          }
          Write-Host '[PASS] P27 9 positive true VST3 PCM matrix cases plus both negative DSP defects'
          exit 0

      - name: P28 strict realtime callback deadline with blocking VST3 negative control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_0.vst3')
          $broken = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_7.vst3')
          if ($exe.Count -ne 1 -or $good.Count -lt 1 -or $broken.Count -lt 1) {
            throw 'P28 real VST3 stress host or blocking negative fixture missing'
          }
          New-Item -ItemType Directory -Force artifacts/P28 | Out-Null
          & $exe[0].FullName --stress $good[0].FullName artifacts/P28/good.tsv 44100 1024 2500 paired --save-only --rt-deadline 2>&1 |
            Tee-Object -FilePath artifacts/P28/good.log
          if ($LASTEXITCODE -ne 0) { throw 'P28 valid VST3 exceeded realtime callback deadline' }
          python tests/verify_state_stress.py artifacts/P28/good.tsv good-realtime
          if ($LASTEXITCODE -ne 0) { throw 'P28 independent good realtime statistics missing or invalid' }
          & $exe[0].FullName --stress $broken[0].FullName artifacts/P28/broken.tsv 44100 1024 2500 paired --save-only --rt-deadline 2>&1 |
            Tee-Object -FilePath artifacts/P28/broken.log
          if ($LASTEXITCODE -ne 1) { throw 'P28 blocking plugin did not trigger strict deadline FAIL' }
          python tests/verify_state_stress.py artifacts/P28/broken.tsv bad-realtime
          if ($LASTEXITCODE -ne 0) { throw 'P28 independent oracle did not confirm deliberate callback deadline overruns' }
          Write-Host '[PASS] P28 real callback p95/p99/max and hard realtime deadline; broken VST3 blocked > deadline'
          exit 0

      - name: P30 native VST3 controller disconnect and reconnect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Controller_Recovery.exe')
          if ($exe.Count -ne 1) { throw 'P30 controller host missing' }
          New-Item -ItemType Directory -Force artifacts/P30 | Out-Null
          foreach ($mode in @(0,1)) {
            $plugin = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_Controller_$mode.vst3")
            if ($plugin.Count -lt 1) { throw "P30 plugin mode $mode missing" }
            $label = @('good','broken')[$mode]
            $report = "artifacts/P30/$label.tsv"
            & $exe[0].FullName --connection $plugin[0].FullName $report
            if ($LASTEXITCODE -ne 0) { throw "P30 $label API lifecycle failed" }
            python tests/verify_controller_recovery.py $report $label
            if ($LASTEXITCODE -ne 0) { throw "P30 $label independent oracle failed" }
          }
          Write-Host '[PASS] P30 real controller recovery and stale state fault detection'

      - name: P31 native HWND visual-state recovery and deliberate stale-color oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Gui_Recovery.exe')
          if ($exe.Count -ne 1) { throw 'P31 GUI pixel host missing' }
          New-Item -ItemType Directory -Force artifacts/P31 | Out-Null
          foreach ($mode in @(0,1)) {
            $plugin = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_Visual_$mode.vst3")
            if ($plugin.Count -lt 1) { throw "P31 GUI VST3 mode $mode missing" }
            $label = @('good','broken')[$mode]
            $report = "artifacts/P31/$label.tsv"
            & $exe[0].FullName --connection $plugin[0].FullName $report 2>&1 |
              Tee-Object -FilePath "artifacts/P31/$label-host.log"
            if ($LASTEXITCODE -ne 0) { throw "P31 $label real HWND editor lifecycle failed" }
            python tests/verify_gui_recovery.py $report $label 2>&1 |
              Tee-Object -FilePath "artifacts/P31/$label-oracle.log"
            if ($LASTEXITCODE -ne 0) { throw "P31 $label actual pixel/PCM oracle failed" }
          }
          Write-Host '[PASS] P31 real Win32 IPlugView visual status and stale controller color detected'
          exit 0

      - name: P32 external VST3 adapter positive and fail-closed negative gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_0.vst3')
          $bad = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_2.vst3')
          if ($hostExe.Count -ne 1 -or $good.Count -lt 1 -or $bad.Count -lt 1) {
            throw 'P32 native host or real VST3 fixtures missing'
          }
          python tests/test_playback_save_overlap.py
          if ($LASTEXITCODE -ne 0) { throw 'P32 failed to detect project saves performed only after playback stopped' }
          python tests/test_p32_stale_evidence.py
          if ($LASTEXITCODE -ne 0) { throw 'P32 stale evidence negative control failed' }
          python tests/make_p32_fixtures.py --host $hostExe[0].FullName --good $good[0].FullName --bad $bad[0].FullName --out artifacts/P32/manifests
          if ($LASTEXITCODE -ne 0) { throw 'P32 manifest generation failed' }
          python tests/run_product_adapter.py --adapter artifacts/P32/manifests/good.json --out artifacts/P32/good
          if ($LASTEXITCODE -ne 0) { throw 'P32 correctly implemented VST3 did not pass real playback-save oracle' }
          $goodReport = Get-Content artifacts/P32/good/ADAPTER-RESULT.json -Raw | ConvertFrom-Json
          if ($goodReport.status -ne 'PASS' -or $goodReport.coverage.bank_program_semantics -ne 'NOT COVERED' -or
              $goodReport.cases[0].measured_active_playback_saves -le 0) {
            throw 'P32 positive status or semantic coverage is incorrect'
          }
          python tests/run_product_adapter.py --adapter artifacts/P32/manifests/broken.json --out artifacts/P32/broken
          if ($LASTEXITCODE -ne 1) { throw 'P32 broken-save VST3 was not detected as a test failure' }
          $brokenReport = Get-Content artifacts/P32/broken/ADAPTER-RESULT.json -Raw | ConvertFrom-Json
          if ($brokenReport.status -ne 'FAIL' -or -not ($brokenReport.cases[0].faults -join ' ').Contains('save_failures')) {
            throw 'P32 broken fixture was not rejected for failed playback saves'
          }
          foreach ($negative in @('wrong_hash','missing_oracle')) {
            python tests/run_product_adapter.py --adapter "artifacts/P32/manifests/$negative.json" --out "artifacts/P32/$negative"
            if ($LASTEXITCODE -ne 2) { throw "P32 $negative invalid adapter accepted" }
          }
          Write-Host '[PASS] P32 real native playback saves; exact binary SHA and independent oracle fail closed'
          exit 0

      - name: P33 independent state, WAV and painted RGB artifact negative controls
        shell: pwsh
        run: |
          python tests/test_p33_artifacts.py
          if ($LASTEXITCODE -ne 0) { throw 'P33 independent artifact oracle failed' }

      - name: P34 real native VST3 PCM and state capture plus adverse controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/test_p34_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'P34 adverse capture fixtures failed' }
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_0.vst3')
          if ($hostExe.Count -ne 1 -or $good.Count -lt 1) { throw 'P34 native host or VST3 fixture missing' }
          python tests/make_p34_capture_manifest.py --host $hostExe[0].FullName --bundle $good[0].FullName --out artifacts/P34/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'P34 manifest creation failed' }
          python tests/run_p34_capture.py --manifest artifacts/P34/manifest.json --out artifacts/P34/positive
          if ($LASTEXITCODE -ne 0) { throw 'P34 genuine VST3 capture failed' }
          $report = Get-Content artifacts/P34/positive/CAPTURE-RESULT.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or $report.capture.gui -ne 'NOT COVERED' -or
              $report.capture.state -ne 'PASS' -or $report.capture.audio -ne 'PASS') {
            throw 'P34 incorrect native capture coverage'
          }
          $bad = Get-Content artifacts/P34/manifest.json -Raw | ConvertFrom-Json
          $bad.product.sha256 = 'f' * 64
          $bad | ConvertTo-Json -Depth 8 | Set-Content artifacts/P34/wrong-hash.json
          python tests/run_p34_capture.py --manifest artifacts/P34/wrong-hash.json --out artifacts/P34/negative
          if ($LASTEXITCODE -ne 1) { throw 'P34 wrong native VST3 SHA was accepted' }
          Write-Host '[PASS] P34 native captured PCM/state with binary SHA and negative controls'
          exit 0

      - name: Independent real VST3 audible PCM reference and mutation proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/test_audio_reference.py --real-captured artifacts/P34/positive/captured.wav --out artifacts/P34/independent-audio
          if ($LASTEXITCODE -ne 0) { throw 'Source-built real VST3 PCM differs from separate mathematical reference or mutations were missed' }
          $proof = Get-Content artifacts/P34/independent-audio/AUDIO-REFERENCE-RESULT.json -Raw | ConvertFrom-Json
          if ($proof.status -ne 'PASS' -or $proof.musical_correctness -ne 'REFERENCE_MATCH' -or
              $proof.mismatched_samples -ne 0) {
            throw 'Independent mathematical audio reference missing or falsely green'
          }
          Write-Host '[PASS] Real VST3 PCM compared to separately generated reference and mutations rejected'
          exit 0

      - name: Production acceptance false-PASS negative controls
        shell: pwsh
        run: |
          python tests/test_product_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance evidence gate negative controls failed' }
          exit 0

      - name: One-command real VST3 QA smoke and release NO-GO controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/run_product_qa.py --p32 artifacts/P32/manifests/good.json --p34 artifacts/P34/manifest.json --out artifacts/PRODUCT-QA
          if ($LASTEXITCODE -ne 0) { throw 'Real VST3 product QA runner failed' }
          $report = Get-Content artifacts/PRODUCT-QA/PRODUCT-QA-RESULT.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'TECHNICAL_PASS' -or $report.release_approved -ne $false -or
              $report.coverage.user_gui_controls -ne 'NOT COVERED') {
            throw 'Product QA improperly certified untested GUI or release'
          }
          $tampered = Get-Content artifacts/P34/manifest.json -Raw | ConvertFrom-Json
          $tampered.product.sha256 = '0' * 64
          $tampered | ConvertTo-Json -Depth 10 | Set-Content artifacts/PRODUCT-QA/wrong-product.json
          python tests/run_product_qa.py --p32 artifacts/P32/manifests/good.json --p34 artifacts/PRODUCT-QA/wrong-product.json --out artifacts/PRODUCT-QA/negative
          if ($LASTEXITCODE -ne 1) { throw 'Product QA accepted mismatched binary identities' }
          $bad = Get-Content artifacts/PRODUCT-QA/negative/PRODUCT-QA-RESULT.json -Raw | ConvertFrom-Json
          if ($bad.status -ne 'FAIL' -or $bad.release_approved -ne $false) {
            throw 'Product QA mismatch negative control did not fail closed'
          }
          Write-Host '[PASS] Real product QA technical runner and release gate negative proof'
          exit 0

      - name: Real VST3 fresh-process save and reload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/test_state_reload.py
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-process recall negative controls failed' }
          $capture = Get-Content artifacts/P34/manifest.json -Raw | ConvertFrom-Json
          $manifest = @{
            schema = '125a-state-reload-v1'
            product = $capture.product
            host = $capture.host
            initial_state = (Resolve-Path artifacts/P34/positive/captured-state.bin).Path
            deterministic_audio = $true
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content artifacts/P34/recall-manifest.json
          python tests/run_state_reload.py --manifest artifacts/P34/recall-manifest.json --out artifacts/P34/recall
          if ($LASTEXITCODE -ne 0) { throw 'Native VST3 fresh-process recall failed' }
          $report = Get-Content artifacts/P34/recall/RECALL-RESULT.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or $report.new_process_instances -ne 2 -or
              $report.fresh_process_recall -ne 'PASS' -or $report.audio_determinism -ne 'PASS' -or
              $report.musical_correctness -ne 'NOT COVERED') {
            throw 'Fresh-process recall evidence is incomplete or falsely asserts musical correctness'
          }
          Write-Host '[PASS] Real VST3 state reload into two separate host processes and repeatable PCM'
          exit 0

      - name: One-command real VST3 quickcheck without handwritten manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/test_plugin_quickcheck.py
          if ($LASTEXITCODE -ne 0) { throw 'Quickcheck identity and stale-evidence negative controls failed' }
          $audio = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $stress = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_State_0.vst3')
          if ($audio.Count -ne 1 -or $stress.Count -ne 1 -or $good.Count -lt 1) {
            throw 'Quickcheck native host or VST3 fixture missing'
          }
          python tests/run_plugin_quickcheck.py --plugin $good[0].FullName --host $audio[0].FullName --stress-host $stress[0].FullName --out artifacts/QUICKCHECK
          if ($LASTEXITCODE -ne 0) { throw 'Actual real VST3 one-command test failed' }
          $report = Get-Content artifacts/QUICKCHECK/QUICKCHECK-RESULT.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'TECHNICAL_PASS' -or $report.release_approved -ne $false -or
              $report.coverage.product_gui_controls -ne 'NOT COVERED' -or
              $report.coverage.api_playback_save -ne 'PASS' -or
              $report.coverage.fresh_process_project_recall -ne 'PASS' -or
              $report.coverage.recall_audio_determinism -ne 'NOT COVERED' -or
              $report.coverage.realtime_deadline_observation -notin @('PASS','FAIL')) {
            throw 'Quickcheck coverage or release classification incorrect'
          }
          $gui = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $click = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Click.vst3')
          if ($gui.Count -ne 1 -or $click.Count -lt 1) { throw 'Portable GUI host or real GUI fixture missing' }
          & $gui[0].FullName --inventory-parameters $click[0].FullName artifacts/QUICKCHECK/native-gui-parameters.tsv
          if ($LASTEXITCODE -ne 0) { throw 'Genuine Windows VST3 parameter discovery failed' }
          python tests/verify_parameter_inventory.py --inventory artifacts/QUICKCHECK/native-gui-parameters.tsv --out artifacts/QUICKCHECK/native-gui-parameters
          if ($LASTEXITCODE -ne 0) { throw 'Independent native parameter inventory audit failed' }
          & $gui[0].FullName --probe $click[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Portable native GUI probe failed to attach/detach real VST3 editor' }
          $deadlineProof = Get-Content artifacts/QUICKCHECK/native/P32/ADAPTER-RESULT.json -Raw | ConvertFrom-Json
          if ($deadlineProof.cases.Count -ne 6 -or
              @($deadlineProof.cases | Where-Object {
                $_.realtime_certification -notin @('PASS','FAIL') -or
                $null -eq $_.timing.callback_overruns -or
                $null -eq $_.timing.callback_p99_ns -or
                $null -eq $_.timing.callback_deadline_ns
              }).Count -ne 0) {
            throw 'Native audio deadline report incomplete; realtime PASS would be ungrounded'
          }
          Write-Host '[PASS] One command exercises actual VST3 playback-save, PCM/state and real callback timing evidence'
          exit 0

      - name: Stage portable one-command Windows VST3 quickcheck kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'artifacts/PORTABLE'
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($binaryName in @('125A_Test_Lab_Host.exe','125A_Test_Lab_State_Stress.exe','125A_Test_Lab_GUI.exe')) {
            $found = @(Get-ChildItem build -Recurse -File -Filter $binaryName)
            if ($found.Count -ne 1) { throw "Portable Test Lab host missing: $binaryName" }
            Copy-Item -LiteralPath $found[0].FullName -Destination "$dir/$binaryName"
          }
          foreach ($script in @('run_plugin_quickcheck.py','run_product_qa.py','run_product_adapter.py','run_p34_capture.py','run_gui_control_matrix.py','verify_p33_artifacts.py','run_state_reload.py','write_user_report.py','verify_audio_reference.py','verify_parameter_inventory.py')) {
            if (-not (Test-Path "tests/$script")) { throw "Portable QA script missing: $script" }
            Copy-Item -LiteralPath "tests/$script" -Destination "$dir/$script"
          }
          Copy-Item tests/Run-VST3-Test.cmd "$dir/Run-VST3-Test.cmd"
          Copy-Item docs/ONE-COMMAND-QUICKCHECK.md "$dir/README.md"
          python -m py_compile "$dir/run_plugin_quickcheck.py" "$dir/run_product_qa.py" "$dir/run_product_adapter.py" "$dir/run_p34_capture.py" "$dir/run_gui_control_matrix.py" "$dir/verify_p33_artifacts.py" "$dir/run_state_reload.py" "$dir/write_user_report.py" "$dir/verify_audio_reference.py" "$dir/verify_parameter_inventory.py"
          if ($LASTEXITCODE -ne 0) { throw 'Portable Python scripts syntax check failed' }
          python tests/test_user_report.py
          if ($LASTEXITCODE -ne 0) { throw 'German results/report mutation controls failed' }
          python "$dir/write_user_report.py" --result artifacts/QUICKCHECK/QUICKCHECK-RESULT.json --out artifacts/PORTABLE/TESTERGEBNIS.html
          if ($LASTEXITCODE -ne 0) { throw 'Could not render actual native VST3 user report' }
          $page = Get-Content "$dir/TESTERGEBNIS.html" -Raw
          if (-not ($page.Contains('Technische Pruefungen bestanden') -and
                    $page.Contains('KEINE PRODUKTFREIGABE') -and
                    $page.Contains('NICHT GEPRUEFT'))) {
            throw 'User report asserts false product release readiness'
          }
          $launcherText = Get-Content "$dir/Run-VST3-Test.cmd" -Raw
          if (-not $launcherText.Contains('run_plugin_quickcheck.py') -or
              -not $launcherText.Contains('--gui-host')) {
            throw 'Portable Windows launcher does not invoke the combined audio/GUI quickcheck'
          }
          $env:CI = 'true'
          & "$dir/Run-VST3-Test.cmd"
          if ($LASTEXITCODE -ne 2) { throw 'Windows launcher without a VST3 accepted empty input' }
          $env:CI = $null
          Get-ChildItem $dir -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "$dir/SHA256.txt"
          Write-Host '[PASS] Portable Windows native host and scripts staged with SHA256 fingerprints'
          exit 0

      - name: Publish proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Universal-VST3-State-Stress-P25
          path: |
            artifacts/P25/
            artifacts/P26/
            artifacts/P27/
            artifacts/P30/
            artifacts/P31/
            artifacts/P32/
            artifacts/P28/
            artifacts/P34/
            artifacts/PRODUCT-QA/
            artifacts/QUICKCHECK/
            artifacts/PORTABLE/
          if-no-files-found: warn
          retention-days: 14
