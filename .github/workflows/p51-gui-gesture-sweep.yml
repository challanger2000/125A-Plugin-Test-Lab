name: P51 genuine native GUI gesture sweep

on:
  pull_request:
    paths:
      - 'tests/run_gui_gesture_sweep.py'
      - 'tests/test_gui_gesture_sweep.py'
      - '.github/workflows/p51-gui-gesture-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate strict sweep contracts and adversarial evidence
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_gui_gesture_sweep.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P51 regression tests failed' }
          python -m py_compile tests/run_gui_gesture_sweep.py tests/test_gui_gesture_sweep.py
          if ($LASTEXITCODE -ne 0) { throw 'P51 Python syntax check failed' }

  native-drag-proof:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build native Windows VST3 editor and GUI host
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build build --config Release --target TestLabGUI QAGuiToggle --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Two native mouse-drag actions and independently expected VST3 transitions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $plugin = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Toggle.vst3')
          if ($hostExe.Count -ne 1 -or $plugin.Count -ne 1) { throw 'Native GUI fixture missing' }
          $dll = @(Get-ChildItem $plugin[0].FullName -Recurse -File -Filter '*.vst3')
          if ($dll.Count -ne 1) { throw 'Ambiguous plugin module' }
          $fingerprint = (Get-FileHash $dll[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            schema = '125a-gui-gesture-sweep-v1'
            product = @{ binary = $dll[0].FullName; sha256 = $fingerprint }
            gui_host = $hostExe[0].FullName
            param_id = 9001
            initial_normalized = 0.0
            checkpoints = @(
              @{ start_x = 100; start_y = 70; end_x = 140; end_y = 90; expected_normalized = 1.0 },
              @{ start_x = 140; start_y = 90; end_x = 100; end_y = 70; expected_normalized = 0.0 }
            )
          }
          New-Item -ItemType Directory -Force build/p51 | Out-Null
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 build/p51/contract.json
          python tests/run_gui_gesture_sweep.py --manifest build/p51/contract.json --out build/p51/evidence
          if ($LASTEXITCODE -ne 0) { throw 'Native VST3 drag chain failed' }
          $r = Get-Content build/p51/evidence/GUI-GESTURE-SWEEP-RESULT.json -Raw | ConvertFrom-Json
          if ($r.status -ne 'CONTRACT_PASS' -or $r.verified_checkpoints -ne 2 -or $r.release_approved -ne $false) { throw 'P51 expected native evidence missing' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P51-real-Windows-VST3-drag-evidence
          path: build/p51/
          if-no-files-found: warn
