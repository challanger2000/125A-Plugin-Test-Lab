name: P82 opted-in unknown VST3 GUI probing on native Windows
on:
  pull_request:
    paths:
      - 'tests/run_universal_qa.py'
      - 'tests/test_p82_unknown_gui_pipeline.py'
      - '.github/workflows/p82-unknown-gui.yml'
      - 'docs/P82-UNKNOWN-GUI-EXPLORATION.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unknown-controls:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed exploration contracts and P74 compatibility
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_p82_unknown_gui_pipeline.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P82 contract tests FAILED' }
          python -m unittest discover -s tests -p test_universal_qa.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P74 compatibility FAILED' }
      - name: Build real GUI interaction, inert control and native GUI host
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P82 CMake configure FAILED' }
          cmake --build build --config Release --parallel 4 --target TestLabGUI QAGuiClick QAGuiInert
          if ($LASTEXITCODE -ne 0) { throw 'P82 native VST3 compilation FAILED' }
      - name: Explore an unknown real VST3 GUI, compare good interactive and inert control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gui = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Click.vst3')
          $inert = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Inert.vst3')
          if ($gui.Count -ne 1 -or $good.Count -ne 1 -or $inert.Count -ne 1) {
            throw 'P82 required real VST3/GUI binaries missing'
          }
          foreach ($case in @(
            @{name='interactive';plugin=$good[0].FullName;expectCandidate=$true},
            @{name='inert';plugin=$inert[0].FullName;expectCandidate=$false}
          )) {
            $out = "build/p82/$($case.name)"
            python tests/run_universal_qa.py --plugin $case.plugin --gui-host $gui[0].FullName --out $out --explore-unknown-gui --exploration-points '160,90' --exploration-max-points 1
            if ($LASTEXITCODE -ne 0) { throw "P82 native GUI exploration FAILED: $($case.name)" }
            $report = Get-Content "$out/UNIVERSAL-QA-RESULT.json" -Raw | ConvertFrom-Json
            if ($report.status -ne 'INVENTORY_WITH_EXPLORATORY_OBSERVATIONS' -or
                $report.unknown_gui_exploration -ne 'OBSERVATIONS_COMPLETE' -or
                $report.exploratory_clicks_performed -ne 1 -or
                $report.gui_clicks_automatically_authorized -ne 0 -or
                $report.release_approved -ne $false -or
                $report.unknown_gui_semantics -ne 'UNAPPROVED OBSERVATIONS ONLY') {
              throw "P82 real GUI reporting false PASS: $($case.name)"
            }
            if ($case.expectCandidate) {
              if ($report.exploratory_candidates_observed -lt 1) {
                throw 'P82 native active GUI control not detected'
              }
            } elseif ($report.exploratory_candidates_observed -ne 0) {
              throw 'P82 inert control falsely detected as interactive'
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P82-native-sham-controlled-unknown-GUI-click-observations
          path: build/p82/
          if-no-files-found: warn
