name: P100 multi-output VST3 state-stress independent positive and negative
on:
  push:
    branches: ['feature/p100-**']
    paths:
      - 'src/state_stress.cpp'
      - 'tests/state_race_fixture.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/p100-multibus-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-windows-host:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build real VST3 state stress and adversarial multi-output fixtures
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64
          if($LASTEXITCODE -ne 0) {throw 'P100 CMake failed'}
          cmake --build build --config Release --parallel 4 --target TestLabStateStress QAStateMode0 QAStateMode11 QAStateMode12
          if($LASTEXITCODE -ne 0) {throw 'P100 multi-bus host or fixture compilation failed'}
      - name: Exercise 9-bus happy path, broken discrete output, and unchanged stereo path
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $hostExe=@(Get-ChildItem build -File -Recurse -Filter '125A_Test_Lab_State_Stress.exe')
          $good=@(Get-ChildItem build -Directory -Recurse -Filter '125A_QA_State_11.vst3')
          $bad=@(Get-ChildItem build -Directory -Recurse -Filter '125A_QA_State_12.vst3')
          $one=@(Get-ChildItem build -Directory -Recurse -Filter '125A_QA_State_0.vst3')
          if($hostExe.Count -ne 1 -or $good.Count -ne 1 -or $bad.Count -ne 1 -or $one.Count -ne 1) {
            throw 'P100 native VST3 fixtures missing or ambiguous'
          }
          New-Item -ItemType Directory -Force results | Out-Null
          & $hostExe[0].FullName --stress $good[0].FullName results/good.tsv 48000 64 2500 none --save-only
          if($LASTEXITCODE -ne 0) {throw 'P100 good 9-bus VST3 was rejected'}
          & $hostExe[0].FullName --stress $one[0].FullName results/legacy.tsv 48000 64 2500 none --save-only
          if($LASTEXITCODE -ne 0) {throw 'P100 single-output VST3 regression'}
          & $hostExe[0].FullName --stress $bad[0].FullName results/aux-bad.tsv 48000 64 2500 none --save-only
          $badCode=$LASTEXITCODE
          if($badCode -ne 1) {throw 'P100 broken auxiliary bus did not trigger native rejection'}
          $reports=@{}
          foreach($name in @('good','legacy','aux-bad')) {
            $map=@{}
            Get-Content "results/$name.tsv" | ForEach-Object {
              $parts=$_ -split "`t",2
              if($parts.Count -eq 2){$map[$parts[0]]=$parts[1]}
            }
            $reports[$name]=$map
          }
          if($reports['good']['result'] -ne 'PASS' -or
             $reports['good']['output_buses'] -ne '9' -or
             $reports['good']['process_failures'] -ne '0' -or
             $reports['legacy']['result'] -ne 'PASS' -or
             $reports['legacy']['output_buses'] -ne '1' -or
             $reports['aux-bad']['result'] -ne 'FAIL' -or
             $reports['aux-bad']['output_buses'] -ne '9' -or
             [int]$reports['aux-bad']['process_failures'] -le 0 -or
             $reports['aux-bad']['timing_certification'] -ne 'NOT COVERED') {
            throw 'P100 native multi-bus PCM oracle result contradicts actual outputs'
          }
          Write-Host 'P100_9_BUS_AND_BAD_AUX_NEGATIVE=PASS'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P100-9-bus-native-stress-good-bad-stereo-evidence
          path: results/**
          if-no-files-found: warn
