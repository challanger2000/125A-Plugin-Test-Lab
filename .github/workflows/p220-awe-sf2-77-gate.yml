name: P220 sample-exact dry, stereo and release-blocker QA
on:
  push:
    branches: [qa/p220-awe-sf2-77-sound-gate]
    paths:
      - tests/p220_awe_sf2_sound_gate.py
      - tests/test_p220_awe_sf2_sound_gate.py
      - tests/run_unified_qa_gaps.py
      - tests/test_p220_awe_unified_release.py
      - tests/run_external_daw_capture_check.py
      - tests/test_p90_external_capture_check.py
      - .github/workflows/p220-awe-sf2-77-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-77-original-audio-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare evidence for the current QA source; do not repeat the accepted integration preflight
        run: |
          set -euo pipefail
          export P220_DRY_OUT="$RUNNER_TEMP/p220-dry-evidence"
          echo "P220_DRY_OUT=$P220_DRY_OUT" >> "$GITHUB_ENV"
          mkdir -p "$P220_DRY_OUT"
          git -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
          git diff --exit-code
      - name: Run existing P220 stereo and 154-case regression plus event-bounded dry positive and adverse controls
        run: |
          set -euo pipefail
          python -m py_compile tests/p220_awe_sf2_sound_gate.py tests/test_p220_awe_sf2_sound_gate.py tests/run_external_daw_capture_check.py tests/run_unified_qa_gaps.py
          python tests/test_p220_awe_sf2_sound_gate.py --compare-baseline \
            --stereo-evidence "$P220_DRY_OUT/p220-stereo-v2.json" \
            --dry-evidence "$P220_DRY_OUT/p220-dry-v1.json" \
            --dry-fixtures-out "$P220_DRY_OUT/synthetic-inputs" 2>&1 | tee "$P220_DRY_OUT/p220-full.log"
      - name: Verify actual Test Lab P89 consolidated release blocker rejects absent 77-sound despite technical AWE PASS
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_p220_awe_unified_release.py -v 2>&1 | tee "$P220_DRY_OUT/p220-release.log"
          python tests/test_p89_unified_qa_gaps.py -v 2>&1 | tee "$P220_DRY_OUT/p89.log"
          python tests/test_p90_external_capture_check.py -v 2>&1 | tee "$P220_DRY_OUT/p90.log"
      - name: Prove private original Creative WAV absent in public CI blocks every real preset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys,json,os
          from pathlib import Path
          sys.path.insert(0,"tests")
          from test_p220_awe_sf2_sound_gate import base
          contract,creative,vst=base()
          # Deterministic SYNTHETIC fixture plan used only to
          # exercise release blocker, not an audio reference.
          Path(os.environ["P220_DRY_OUT"],"test-contract.json").write_text(json.dumps(contract))
          PY
          if python tests/p220_awe_sf2_sound_gate.py \
              --contract "$P220_DRY_OUT/test-contract.json" \
              --out "$P220_DRY_OUT/required-real-audio-evidence.json"; then
            echo "P220 FALSE-GREEN: no Win95, no private SF2, no capture WAV but PASS" >&2
            exit 1
          fi
          if python tests/p220_awe_sf2_sound_gate.py --dry-only \
              --contract "$P220_DRY_OUT/test-contract.json" \
              --out "$P220_DRY_OUT/required-real-dry-evidence.json"; then
            echo "P220 FALSE-GREEN: missing actual dry captures approved" >&2
            exit 1
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["P220_DRY_OUT"])/"required-real-audio-evidence.json"
          r=json.loads(p.read_text())
          assert r["status"]=="BLOCKED"
          assert r["release_approved"] is False
          assert len(r["presets"])==77 and all(x["status"]=="BLOCKED" for x in r["presets"])
          assert not r.get("passed_presets")
          dry=json.loads(p.with_name("required-real-dry-evidence.json").read_text())
          assert dry["status"]=="BLOCKED" and dry["release_approved"] is False
          assert dry["passed_cases"]==0 and len(dry["cases"])==77
          assert all(x["status"]=="BLOCKED" for x in dry["cases"])
          print("P220 REQUIRED ORIGINAL SOUND GATE = BLOCKED for all 77 presets; 0 fake Original Creative WAVs PASS")
          PY
      - name: Verify exact QA source, raw comparison evidence and all results; archive current QA source
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,platform,re,subprocess
          from pathlib import Path
          out=Path(os.environ["P220_DRY_OUT"])
          dry=json.loads((out/"p220-dry-v1.json").read_text())
          stereo=json.loads((out/"p220-stereo-v2.json").read_text())
          assert dry["assertions"]==dry["passed_assertions"]==42
          assert all(c["expected"]==c["actual"] for c in dry["cases"])
          assert all(c["result"]["status"]!="PASS" and c["result"]["release_approved"] is False for c in dry["cases"])
          assert sum("historical_comparator" in c for c in dry["cases"])==7
          assert stereo["assertions"]==stereo["passed_assertions"]==13
          assert all(c["expected"]==c["actual"] for c in stereo["cases"])
          for name,expected in dry["source_sha256"].items():
              assert hashlib.sha256(Path("tests",name).read_bytes()).hexdigest()==expected
          for name,count in (("p220-release",7),("p89",4),("p90",14)):
              text=(out/(name+".log")).read_text()
              assert re.search(rf"Ran {count} tests in .+\n\s*\nOK\s*$",text),name
          text=(out/"p220-full.log").read_text()
          assert "P220 SYNTHETIC oracle positive: 77/77 and 154/154" in text
          assert "P220 SYNTHETIC MUTATION AUDIT: 10/10 rejected" in text
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          tree=subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          assert sha==os.environ["GITHUB_SHA"]==dry["github_source_sha"]==stereo["github_source_sha"]
          subprocess.run(["git","diff","--exit-code"],check=True)
          record={"schema":"125a-p220-dry-qa-execution-v1","source_sha":sha,"tree_sha":tree,
              "runner_os":os.environ["RUNNER_OS"],"platform":platform.platform(),
              "dry_expectations":"42/42","stereo_expectations":"13/13",
              "legacy_synthetic_comparisons":"154/154","legacy_mutants":"10/10",
              "unit_tests":"25/25","historical_source_controls":"7/7",
              "source_sha256":dry["source_sha256"],"original_creative_audio":"NOT RUN",
              "actual_windows_vst3_audio":"NOT RUN","real_sound_gate":"77 BLOCKED / 0 PASS",
              "accepted_integration_preflight":"NOT REPEATED","release_approved":False}
          (out/"dry-execution-verified.json").write_text(json.dumps(record,indent=2)+"\n")
          print(f"::notice title=P220 dry QA::SOURCE={sha} TREE={tree} OS={os.environ['RUNNER_OS']} dry=42/42 stereo=13/13 legacy_audio=154/154 mutants=10/10 units=25/25 historical_controls=7/7 real_audio=77_BLOCKED_0_PASS release=false")
          PY
          git archive --format=zip --output="$P220_DRY_OUT/qa-source.zip" HEAD
      - name: Preserve synthetic PCM, raw event traces and test evidence; no private source audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P220-Sample-Exact-Dry-QA-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/p220-dry-evidence/
          if-no-files-found: error
          retention-days: 14
