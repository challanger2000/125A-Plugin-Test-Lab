name: P220 AWE 77 SF2 original Creative audio release-blocker and mutation adequacy
on:
  push:
    branches: [qa/p220-awe-sf2-77-sound-gate]
    paths:
      - tests/p220_awe_sf2_sound_gate.py
      - tests/test_p220_awe_sf2_sound_gate.py
      - tests/run_unified_qa_gaps.py
      - tests/test_p220_awe_unified_release.py
      - tests/prepare_p220_main_integration.py
      - .github/workflows/p220-awe-sf2-77-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-77-original-audio-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      P220_INTEGRATION_ROOT: ${{ runner.temp }}/p220-main-integration
      P220_INTEGRATION_OUT: ${{ runner.temp }}/p220-main-evidence
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble pinned main plus corrected QA in a temporary detached worktree; preserve branch refs
        run: |
          set -euo pipefail
          python tests/prepare_p220_main_integration.py prepare --repo "$GITHUB_WORKSPACE" --worktree "$P220_INTEGRATION_ROOT" --out "$P220_INTEGRATION_OUT"
          python tests/prepare_p220_main_integration.py self-test --repo "$GITHUB_WORKSPACE" --worktree "$P220_INTEGRATION_ROOT" --out "$P220_INTEGRATION_OUT" 2>&1 | tee "$P220_INTEGRATION_OUT/identity-negative-control.log"
      - name: Run exact 77-program/154-scenario SOUND-oracle adversarial test-of-test, not original Creative
        working-directory: ${{ env.P220_INTEGRATION_ROOT }}
        run: |
          set -euo pipefail
          python -m py_compile tests/p220_awe_sf2_sound_gate.py tests/test_p220_awe_sf2_sound_gate.py
          python tests/test_p220_awe_sf2_sound_gate.py --stereo-evidence "$P220_INTEGRATION_OUT/p220-stereo-v2.json" 2>&1 | tee "$P220_INTEGRATION_OUT/p220-full.log"
      - name: Verify actual Test Lab P89 consolidated release blocker rejects absent 77-sound despite technical AWE PASS
        working-directory: ${{ env.P220_INTEGRATION_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_p220_awe_unified_release.py 2>&1 | tee "$P220_INTEGRATION_OUT/p220-release.log"
          python tests/test_p89_unified_qa_gaps.py 2>&1 | tee "$P220_INTEGRATION_OUT/p89.log"
          python tests/test_p90_external_capture_check.py 2>&1 | tee "$P220_INTEGRATION_OUT/p90.log"
      - name: Verify preserved main P99 REA and P74 P75 contracts with existing adversarial unit suites
        working-directory: ${{ env.P220_INTEGRATION_ROOT }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_rea_binary_analysis.py -v 2>&1 | tee "$P220_INTEGRATION_OUT/rea.log"
          python -m unittest discover -s tests -p test_universal_qa.py -v 2>&1 | tee "$P220_INTEGRATION_OUT/universal.log"
          python -m unittest discover -s tests -p test_vst3_batch_qa.py -v 2>&1 | tee "$P220_INTEGRATION_OUT/batch.log"
      - name: Prove private original Creative WAV absent in public CI blocks every real preset
        working-directory: ${{ env.P220_INTEGRATION_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p220"
          python - <<'PY'
          import sys,json,os
          from pathlib import Path
          sys.path.insert(0,"tests")
          from test_p220_awe_sf2_sound_gate import base
          contract,creative,vst=base()
          # Deterministic SYNTHETIC fixture plan used only to
          # exercise release blocker, not an audio reference.
          Path(os.environ["P220_INTEGRATION_OUT"],"test-contract.json").write_text(json.dumps(contract))
          PY
          if python tests/p220_awe_sf2_sound_gate.py \
              --contract "$P220_INTEGRATION_OUT/test-contract.json" \
              --out "$P220_INTEGRATION_OUT/required-real-audio-evidence.json"; then
            echo "P220 FALSE-GREEN: no Win95, no private SF2, no capture WAV but PASS" >&2
            exit 1
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["P220_INTEGRATION_OUT"])/"required-real-audio-evidence.json"
          r=json.loads(p.read_text())
          assert r["status"]=="BLOCKED"
          assert r["release_approved"] is False
          assert len(r["presets"])==77 and all(x["status"]=="BLOCKED" for x in r["presets"])
          assert not r.get("passed_presets")
          print("P220 REQUIRED ORIGINAL SOUND GATE = BLOCKED for all 77 presets; 0 fake Original Creative WAVs PASS")
          PY
      - name: Verify tested source identity and exact results; archive the actual detached combined source
        run: |
          set -euo pipefail
          python tests/prepare_p220_main_integration.py results --repo "$GITHUB_WORKSPACE" --worktree "$P220_INTEGRATION_ROOT" --out "$P220_INTEGRATION_OUT"
          git -C "$P220_INTEGRATION_ROOT" archive --format=zip --output="$P220_INTEGRATION_OUT/combined-source.zip" HEAD
      - name: Preserve public test-of-test blocker only, never private source audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P220-Stereo-v2-Gate-Mutations-and-Required-Blocked-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/p220-main-evidence/
          if-no-files-found: error
          retention-days: 14
