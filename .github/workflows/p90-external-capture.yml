name: P90 independently compare externally supplied DAW audio captures
on:
  pull_request:
    paths:
      - 'tests/run_external_daw_capture_check.py'
      - 'tests/test_p90_external_capture_check.py'
      - '.github/workflows/p90-external-capture.yml'
      - 'docs/P90-EXTERNAL-DAW-ASIO-CAPTURE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-audio:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare real WAV PCM content and reject mock claims of ASIO provenance
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_p90_external_capture_check.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P90 independent PCM acceptance FAILED' }
          python -m py_compile tests/run_external_daw_capture_check.py
          if ($LASTEXITCODE -ne 0) { throw 'P90 Python syntax FAILED' }
