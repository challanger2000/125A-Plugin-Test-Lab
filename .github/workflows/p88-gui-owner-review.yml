name: P88 independent VST3 GUI owner review queue
on:
  pull_request:
    paths:
      - 'tests/run_gui_owner_review_queue.py'
      - 'tests/test_p88_owner_gui_review.py'
      - '.github/workflows/p88-gui-owner-review.yml'
      - 'docs/P88-GUI-OWNER-REVIEW.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-review:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test strict observed native parameter review schema
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_p88_owner_gui_review.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P88 owner review regression FAILED' }
          python -m unittest discover -s tests -p test_p87_parameter_coverage.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P87 compatibility FAILED' }
          python -m py_compile tests/run_gui_owner_review_queue.py
          if ($LASTEXITCODE -ne 0) { throw 'P88 Python syntax FAILED' }
      - name: Compile actual VST3 interactive/inert plugins and test host
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P88 CMake configure FAILED' }
          cmake --build build --config Release --parallel 4 --target TestLabGUI QAGuiClick QAGuiInert
          if ($LASTEXITCODE -ne 0) { throw 'P88 VST3 fixture build FAILED' }
      - name: Native GUI observations to review-only named parameter gaps
        shell: pwsh
        run: |
          $gui = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Click.vst3')
          $inert = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Inert.vst3')
          if ($gui.Count -ne 1 -or $good.Count -ne 1 -or $inert.Count -ne 1) {
            throw 'P88 native test binaries missing or ambiguous'
          }
          foreach ($scenario in @(
            @{name='working';bundle=$good[0].FullName;active=$true},
            @{name='inert';bundle=$inert[0].FullName;active=$false}
          )) {
            $out = "build/p88/$($scenario.name)"
            python tests/run_universal_qa.py --plugin $scenario.bundle --gui-host $gui[0].FullName --out $out --explore-unknown-gui --dense-gui-grid 3 --crosscheck-abi-gui --exploration-repeats 1
            if ($LASTEXITCODE -ne 0) { throw "P88 real native GUI investigation FAILED: $($scenario.name)" }
            $cap = "$out/discovery/vst3-inventory/native-capabilities.tsv"
            $param = "$out/discovery/vst3-inventory/native-parameters.tsv"
            $dense = "$out/unknown-gui-dense-sweep/DENSE-GUI-AUDIT-RESULT.json"
            python tests/run_gui_owner_review_queue.py --capabilities $cap --parameters $param --dense-report $dense --out "$out/review"
            if ($LASTEXITCODE -ne 0) { throw "P88 native ABI/GUI review generation FAILED: $($scenario.name)" }
            $result = Get-Content "$out/review/OWNER-GUI-REVIEW-QUEUE.json" -Raw | ConvertFrom-Json
            if ($result.status -ne 'REVIEW_PACKAGE_COMPLETE' -or
                $result.native_parameter_count -lt 1 -or
                $result.executable_p65_plan_generated -ne $false -or
                $result.complete_ui_inventory -ne $false -or
                $result.release_approved -ne $false -or
                $result.parameter_review_queue.Count -ne $result.native_parameter_count) {
              throw "P88 native product review evidence wrong: $($scenario.name)"
            }
            if ($scenario.active) {
              if ($result.observed_parameter_count -lt 1) { throw 'P88 active GUI parameter observation missing' }
            } elseif ($result.observed_parameter_count -ne 0) {
              throw 'P88 inert control incorrectly marked as functioning'
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P88-native-VST3-owner-parameter-review-queues
          path: build/p88/
          if-no-files-found: warn
