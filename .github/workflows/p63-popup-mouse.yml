name: P63 actual Windows popup menu mouse selection

on:
  pull_request:
    paths:
      - 'src/gui_host.cpp'
      - 'tests/gui_fixture.cpp'
      - 'tests/run_gui_owned_dialog.py'
      - 'tests/test_gui_popup_mouse.py'
      - '.github/workflows/p63-popup-mouse.yml'
  workflow_dispatch:

concurrency:
  group: p93-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Distinguish real menu tracking from a fabricated WM_COMMAND shortcut
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_gui_popup_mouse.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P63 independent real menu selection contract failed' }
          python -m unittest discover -s tests -p test_gui_native_menu.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P62 previous menu contract regressed' }

  native-win32-selection:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build genuine source-based popup menu VST3 plus Windows GUI host
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P63 CMake configure failed' }
          cmake --build build --config Release --parallel 4 --target TestLabGUI QAGuiPopupGood QAGuiPopupBad
          if ($LASTEXITCODE -ne 0) { throw 'P63 source-built native VST3 compilation failed' }
      - name: Select real popup item with SendInput mouse and reject incorrect command
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          if ($exe.Count -ne 1) { throw 'Real native Win32 GUI host missing' }
          foreach ($variant in @('Good','Bad')) {
            $bundle = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_GUI_Popup$variant.vst3")
            if ($bundle.Count -ne 1) { throw "P63 $variant source-built VST3 missing" }
            $PSNativeCommandUseErrorActionPreference = $false
            python tests/run_gui_owned_dialog.py --plugin $bundle[0].FullName --gui-host $exe[0].FullName --out "build/p63-$variant" --x 160 --y 90 --acknowledge-ui-clicks --select-popup-mouse
            $code = $LASTEXITCODE
            $report = Get-Content "build/p63-$variant/OWNED-DIALOG-RESULT.json" -Raw | ConvertFrom-Json
            if (Test-Path "build/p63-$variant/native.log") {
              Get-Content "build/p63-$variant/native.log" | ForEach-Object { Write-Host "P63 NATIVE: $_" }
            }
            if ($variant -eq 'Good') {
              if ($code -ne 0 -or $report.status -ne 'CONTRACT_PASS' -or $report.physical_menu_selection -ne 'MOUSE_SELECTED_OS_MENU' -or $report.actual_win32_popup_tracking -ne 'MOUSE_SELECTED_OS_MENU') {
                throw 'P63 actual mouse-selected Windows popup item did not pass'
              }
            } else {
              if ($code -ne 1 -or $report.status -ne 'FAIL' -or $report.physical_menu_selection -ne 'NOT COVERED') {
                throw 'P63 deliberately wrong native popup item not rejected'
              }
            }
            if ($report.release_approved -ne $false) {
              throw 'P63 mouse popup probe improperly approved commercial VST3 release'
            }
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P63-genuine-mouse-TrackPopupMenuEx-actual-VST3-fixtures
          path: |
            build/p63-Good/
            build/p63-Bad/
          if-no-files-found: warn
