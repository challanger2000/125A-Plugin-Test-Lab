name: P106 universal Windows EXE/MSI installer observer – safe fixture
on:
  pull_request:
    paths:
      - 'tests/Invoke-UniversalInstaller.ps1'
      - 'tests/Test-UniversalInstaller.ps1'
      - 'tests/p106_installer_fixture.cs'
      - 'tests/p106_msi_fixture.wxs'
      - 'tests/p106-msi-marker.txt'
      - 'tests/Test-UniversalMSI.ps1'
      - 'docs/P106-UNIVERSAL-WINDOWS-INSTALLER.md'
      - '.github/workflows/p106-universal-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-built-exe-installer:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Execute real harmless Windows EXE and adversarial refusal tests
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/Test-UniversalInstaller.ps1 -WorkingRoot (Join-Path $env:RUNNER_TEMP 'P106-safe-fixture')
          if ($LASTEXITCODE -ne 0) { throw "P106 actual fixture regressions failed: $LASTEXITCODE" }
      - name: Install pinned WiX build tool for harmless MSI test
        shell: pwsh
        run: |
          dotnet tool install wix --tool-path (Join-Path $env:RUNNER_TEMP 'p106-wix-tools') --version 6.0.2
          if ($LASTEXITCODE -ne 0) { throw 'P106 pinned WiX tool install failed' }
      - name: Actually install hash-verified harmless MSI and check refusal paths
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/Test-UniversalMSI.ps1 -WorkingRoot (Join-Path $env:RUNNER_TEMP 'P106-safe-msi-fixture') -WixExecutable (Join-Path $env:RUNNER_TEMP 'p106-wix-tools/wix.exe')
          if ($LASTEXITCODE -ne 0) { throw "P106 actual MSI regressions failed: $LASTEXITCODE" }
      - name: Publish sandbox-only evidence (no installer binary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P106-harmless-fixture-evidence-NOT-vendor-release-approval
          path: |
            ${{ runner.temp }}/P106-safe-fixture/*/P106-INSTALLER-RESULT.json
            ${{ runner.temp }}/P106-safe-msi-fixture/*/P106-INSTALLER-RESULT.json
          if-no-files-found: error
