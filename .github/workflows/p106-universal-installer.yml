name: P106 universal Windows EXE/MSI installer observer – safe fixture
on:
  pull_request:
    paths:
      - 'tests/Invoke-UniversalInstaller.ps1'
      - 'tests/Test-UniversalInstaller.ps1'
      - 'tests/p106_installer_fixture.cs'
      - 'tests/p106_msi_fixture.wxs'
      - 'tests/p106-msi-marker.txt'
      - 'tests/Test-UniversalMSI.ps1'
      - 'tests/Invoke-InstalledVst3QA.ps1'
      - 'tests/Test-InstalledVst3Handoff.ps1'
      - 'tests/Get-Vst3BundleManifest.ps1'
      - 'tests/Test-Vst3BundleManifest.ps1'
      - 'tests/P109-LinkCount.ps1'
      - 'docs/P106-UNIVERSAL-WINDOWS-INSTALLER.md'
      - '.github/workflows/p106-universal-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-built-exe-installer:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Parse all P106 PowerShell entrypoints before any installer runs
        shell: pwsh
        run: |
          $files = @(
            'tests/Invoke-UniversalInstaller.ps1',
            'tests/Invoke-InstalledVst3QA.ps1',
            'tests/Test-UniversalInstaller.ps1',
            'tests/Test-UniversalMSI.ps1',
            'tests/Test-InstalledVst3Handoff.ps1',
            'tests/Get-Vst3BundleManifest.ps1',
            'tests/Test-Vst3BundleManifest.ps1',
            'tests/P109-LinkCount.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) {
              throw "P106 PowerShell syntax FAIL in $file : $($errors -join '; ')"
            }
          }
          Write-Host 'P106 all 8 PowerShell scripts parsed without syntax errors'
      - name: Execute real harmless Windows EXE and adversarial refusal tests
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/Test-UniversalInstaller.ps1 -WorkingRoot (Join-Path $env:RUNNER_TEMP 'P106-safe-fixture')
          if ($LASTEXITCODE -ne 0) { throw "P106 actual fixture regressions failed: $LASTEXITCODE" }
      - name: Install pinned WiX build tool for harmless MSI test
        shell: pwsh
        run: |
          dotnet tool install wix --tool-path (Join-Path $env:RUNNER_TEMP 'p106-wix-tools') --version 6.0.2
          if ($LASTEXITCODE -ne 0) { throw 'P106 pinned WiX tool install failed' }
      - name: Actually install hash-verified harmless MSI and check refusal paths
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/Test-UniversalMSI.ps1 -WorkingRoot (Join-Path $env:RUNNER_TEMP 'P106-safe-msi-fixture') -WixExecutable (Join-Path $env:RUNNER_TEMP 'p106-wix-tools/wix.exe')
          if ($LASTEXITCODE -ne 0) { throw "P106 actual MSI regressions failed: $LASTEXITCODE" }
      - name: Configure pinned Steinberg Windows VST3 SDK (one small native fixture)
        shell: pwsh
        run: |
          cmake -S . -B build-p106 -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P106 pinned SDK CMake configure failed' }
      - name: Build real universal VST3 hosts and one clean plugin
        shell: pwsh
        run: |
          cmake --build build-p106 --config Release --target TestLabHost TestLabGUI TestLabStateStress QAStateMode0 --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'P106 real VST3/host compilation failed' }
      - name: Run actual EXE install to real Windows VST3 -> P74 host integration
        shell: pwsh
        run: |
          $bundle = @(Get-ChildItem build-p106 -Recurse -Directory -Filter '125A_QA_State_0.vst3' | Where-Object { Test-Path (Join-Path $_.FullName 'Contents/x86_64-win/125A_QA_State_0.vst3') -PathType Leaf })
          $gui = @(Get-ChildItem build-p106 -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $audio = @(Get-ChildItem build-p106 -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $stress = @(Get-ChildItem build-p106 -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          if ($bundle.Count -ne 1 -or $gui.Count -ne 1 -or $audio.Count -ne 1 -or $stress.Count -ne 1) {
            throw 'P106 source-built plugin or Windows native hosts missing/ambiguous'
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/Test-InstalledVst3Handoff.ps1 -WorkingRoot (Join-Path $env:RUNNER_TEMP 'P106-real-installed-vst3') -SourceBundle $bundle[0].FullName -GuiHost $gui[0].FullName -AudioHost $audio[0].FullName -StressHost $stress[0].FullName -PythonExecutable (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw "P106 real EXE -> real installed VST3 -> P74 functional QA failed: $LASTEXITCODE" }
      - name: Publish sandbox-only evidence (no installer binary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P106-harmless-fixture-evidence-NOT-vendor-release-approval
          path: |
            ${{ runner.temp }}/P106-safe-fixture/*/P106-INSTALLER-RESULT.json
            ${{ runner.temp }}/P106-safe-msi-fixture/*/P106-INSTALLER-RESULT.json
            ${{ runner.temp }}/P106-real-installed-vst3/*/P106-INSTALLER-RESULT.json
            ${{ runner.temp }}/P106-real-installed-vst3/*/P106-POSTINSTALL-VST3-RESULT.json
            ${{ runner.temp }}/P106-real-installed-vst3/*/P74-native/UNIVERSAL-QA-RESULT.json
          if-no-files-found: error
