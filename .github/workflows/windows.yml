name: 125A Test Lab - Windows P02

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'CMakeLists.txt'
      - 'src/main.cpp'
      - 'src/p15_dropfiles.h'
      - 'tests/signal_fixture.cpp'
      - 'tests/verify_render.py'
      - 'tests/verify_universal_discovery.py'
      - 'tests/run_vst3_batch.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'CMakeLists.txt'
      - 'src/main.cpp'
      - 'src/p15_dropfiles.h'
      - 'tests/signal_fixture.cpp'
      - 'tests/verify_render.py'
      - 'tests/verify_universal_discovery.py'
      - 'tests/run_vst3_batch.py'
  workflow_dispatch:

concurrency:
  group: 125a-testlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-build-and-real-vst3-proof:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (MSVC 2022, x64)
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compile test host and real VST3 fixtures
        shell: pwsh
        run: cmake --build build --config Release --target TestLabHost QASignalGood QASignalBad --parallel 4

      - name: Run transport and invalid-module self-tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "CTest failed ($LASTEXITCODE)" }

      - name: P02 actual VST3 processing and independent PCM24 oracle
        shell: pwsh
        run: |
          $hostExe = Get-ChildItem build -Recurse -File -Filter "125A_Test_Lab_Host.exe" | Select-Object -First 1
          $good = Get-ChildItem build -Recurse -Directory -Filter "125A_QA_SignalGood.vst3" | Select-Object -First 1
          $bad = Get-ChildItem build -Recurse -Directory -Filter "125A_QA_SignalBad.vst3" | Select-Object -First 1
          if (-not $hostExe -or -not $good -or -not $bad) {
            throw "P02 host or VST3 fixtures missing"
          }
          $goodWave = Join-Path (Get-Location) "build\p02-good.wav"
          $badWave = Join-Path (Get-Location) "build\p02-bad.wav"
          Remove-Item $goodWave, $badWave -Force -ErrorAction SilentlyContinue

          Write-Host "Running known-good VST3 through actual VST3 process callback"
          & $hostExe.FullName --render $good.FullName $goodWave 2>&1 | Tee-Object -FilePath build\p02-good-host.log
          if ($LASTEXITCODE -ne 0) { throw "Known-good VST3 render failed ($LASTEXITCODE)" }
          if (-not (Test-Path $goodWave)) { throw "Known-good WAV missing" }

          Write-Host "Independent full-length, sample-exact PCM24 analysis"
          python tests/verify_render.py $goodWave 2>&1 | Tee-Object -FilePath build\p02-good-oracle.log
          if ($LASTEXITCODE -ne 0) { throw "Independent audio analysis failed ($LASTEXITCODE)" }

          Write-Host "Running intentionally corrupt VST3: must reject NaN, not merely crash"
          & $hostExe.FullName --render $bad.FullName $badWave 2>&1 | Tee-Object -FilePath build\p02-bad-host.log
          if ($LASTEXITCODE -ne 1) { throw "Bad VST3 returned $LASTEXITCODE, expected 1" }
          if (Test-Path $badWave) { throw "Bad VST3 incorrectly wrote WAV" }
          $badLog = Get-Content build\p02-bad-host.log -Raw
          if (-not $badLog.Contains("nonfinite audio emitted by plugin")) {
            throw "Bad VST3 rejected for an unexpected reason; NaN detection NOT proven"
          }
          Write-Host "[PASS] P02 real processing + independent waveform oracle + deliberately corrupt VST3 detection"
          exit 0 # Clear expected native exit=1 from deliberately corrupt fixture

      - name: P22 universal VST3 topology discovery and independent capability oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_SignalGood.vst3')
          $bad = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_SignalBad.vst3')
          if ($hostExe.Count -ne 1 -or $good.Count -ne 1 -or $bad.Count -ne 1) {
            throw 'P22 test host or general-purpose VST3 fixtures missing'
          }
          New-Item -ItemType Directory -Force build/p22 | Out-Null
          foreach ($fixture in @(@{id='good';plugin=$good[0].FullName},@{id='bad';plugin=$bad[0].FullName})) {
            $log = "build/p22/$($fixture.id)-inspection.log"
            $json = "build/p22/$($fixture.id)-capabilities.json"
            & $hostExe[0].FullName --inspect $fixture.plugin > $log
            if ($LASTEXITCODE -ne 0) { throw "P22 cannot inspect $($fixture.id) fixture" }
            python tests/verify_universal_discovery.py $log $json
            if ($LASTEXITCODE -ne 0) { throw "P22 invalid topology for $($fixture.id)" }
            $report = Get-Content $json -Raw | ConvertFrom-Json
            if ($report.classes.Count -ne 1 -or
                $report.classes[0].buses.audio_output.Count -ne 1 -or
                $report.classes[0].buses.audio_output[0].channels -ne 2 -or
                $report.classes[0].buses.event_input.Count -ne 1 -or
                $report.classes[0].recommended_gates.midi_input -ne 'ELIGIBLE') {
              throw "P22 unexpected fixture class/bus topology: $($fixture.id)"
            }
          }
          # Negative fixture must NOT report discovery success.
          'invalid binary' | Set-Content build/p22/not-a-vst3.vst3
          & $hostExe[0].FullName --inspect build/p22/not-a-vst3.vst3 > build/p22/invalid-inspection.log 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'P22 invalid module erroneously accepted' }
          $invalidLog = Get-Content build/p22/invalid-inspection.log -Raw
          if (-not $invalidLog.Contains('[FAIL]')) { throw 'P22 negative control did not fail explicitly' }
          Write-Host '[PASS] P22 universal class/bus/processing discovery, independent capability JSON and invalid-module rejection'
          exit 0

      - name: P23 independent multi-VST3 folder scan (positive and negative)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_SignalGood.vst3')
          $bad = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_SignalBad.vst3')
          if ($hostExe.Count -ne 1 -or $good.Count -ne 1 -or $bad.Count -ne 1) {
            throw 'P23 cannot find isolated host or known VST3 bundles'
          }
          New-Item -ItemType Directory -Force build/p23-positive,build/p23-negative | Out-Null
          Copy-Item -LiteralPath $good[0].FullName -Destination build/p23-positive -Recurse
          Copy-Item -LiteralPath $bad[0].FullName -Destination build/p23-positive -Recurse
          python tests/run_vst3_batch.py --host $hostExe[0].FullName --root build/p23-positive --out build/p23-pass-report
          if ($LASTEXITCODE -ne 0) { throw 'P23 multiple real VST3 plugin scan did not PASS' }
          $goodReport = Get-Content build/p23-pass-report/BATCH-RESULT.json -Raw | ConvertFrom-Json
          if ($goodReport.discovered -ne 2 -or $goodReport.passed -ne 2 -or $goodReport.failed -ne 0) {
            throw 'P23 expected both independent VST3 modules to be detected and passed'
          }
          Copy-Item -LiteralPath $good[0].FullName -Destination build/p23-negative -Recurse
          'not a real DLL' | Set-Content build/p23-negative/Invalid.vst3
          python tests/run_vst3_batch.py --host $hostExe[0].FullName --root build/p23-negative --out build/p23-fail-report
          if ($LASTEXITCODE -ne 1) { throw 'P23 invalid VST3 was not surfaced as batch failure' }
          $failed = Get-Content build/p23-fail-report/BATCH-RESULT.json -Raw | ConvertFrom-Json
          if ($failed.discovered -ne 2 -or $failed.passed -ne 1 -or $failed.failed -ne 1) {
            throw 'P23 failed to isolate invalid module from independently valid module'
          }
          Write-Host '[PASS] P23 multi-plugin discovery, per-process isolation and fail-closed JSON report'
          exit 0

      - name: P24 universal isolated audio-smoke checks (good and NaN fixtures)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_SignalGood.vst3')
          $bad = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_SignalBad.vst3')
          if ($exe.Count -ne 1 -or $good.Count -lt 1 -or $bad.Count -lt 1) {
            throw 'P24 universal host/fixtures missing'
          }
          New-Item -ItemType Directory -Force build/p24-good,build/p24-bad | Out-Null
          Copy-Item -LiteralPath $good[0].FullName -Destination build/p24-good -Recurse
          python tests/run_vst3_batch.py --host $exe[0].FullName --root build/p24-good --out build/p24-good-report --audio-smoke
          if ($LASTEXITCODE -ne 0) { throw 'P24 valid VST3 render failed' }
          $positive = Get-Content build/p24-good-report/BATCH-RESULT.json -Raw | ConvertFrom-Json
          if ($positive.status -ne 'PASS' -or $positive.modules.Count -ne 1 -or
              $positive.modules[0].audio_smoke -ne 'PASS') {
            throw 'P24 required non-silent PCM24 audio evidence missing'
          }
          Copy-Item -LiteralPath $bad[0].FullName -Destination build/p24-bad -Recurse
          python tests/run_vst3_batch.py --host $exe[0].FullName --root build/p24-bad --out build/p24-bad-report --audio-smoke
          if ($LASTEXITCODE -ne 1) { throw 'P24 deliberately nonfinite VST3 did not cause failure' }
          $negative = Get-Content build/p24-bad-report/BATCH-RESULT.json -Raw | ConvertFrom-Json
          if ($negative.status -ne 'FAIL' -or $negative.modules.Count -ne 1 -or
              $negative.modules[0].audio_smoke -ne 'FAIL') {
            throw 'P24 did not distinguish valid capability discovery from broken DSP'
          }
          if (-not (Get-Content build/p24-bad-report/module-001-render.log -Raw).Contains('nonfinite audio emitted by plugin')) {
            throw 'P24 failed for the wrong reason'
          }
          Write-Host '[PASS] P24 automatic real PCM render on eligible VST3, nonfinite audio detected independently'
          exit 0

      - name: Stage executable and P02 evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $hostExe = Get-ChildItem build -Recurse -File -Filter "125A_Test_Lab_Host.exe" | Select-Object -First 1
          if (-not $hostExe) { throw "Host executable missing" }
          Copy-Item $hostExe.FullName artifact\
          Copy-Item START-HERE.md artifact\
          Copy-Item -Path build/p22 -Destination artifact/P22 -Recurse
          Copy-Item -Path build/p23-pass-report -Destination artifact/P23-PASS -Recurse
          Copy-Item -Path build/p23-fail-report -Destination artifact/P23-Negative-Control -Recurse
          Copy-Item -Path build/p24-good-report -Destination artifact/P24-Audio-Smoke-PASS -Recurse
          Copy-Item -Path build/p24-bad-report -Destination artifact/P24-Audio-Smoke-Negative -Recurse
          Copy-Item build\p02-good.wav artifact\P02-Reference-Render.wav
          Copy-Item build\p02-good-host.log, build\p02-good-oracle.log, build\p02-bad-host.log artifact\
          Get-FileHash $hostExe.FullName -Algorithm SHA256 | Format-List | Out-File artifact\SHA256.txt

      - name: Publish proven P02 test host and evidence
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Plugin-Test-Lab-P02-Windows-x64
          path: artifact/
          if-no-files-found: error
