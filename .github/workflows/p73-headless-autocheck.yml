name: P73 headless VST3 onboarding and opt-in universal technical autocheck

on:
  pull_request:
    paths:
      - 'tests/run_plugin_onboarding.py'
      - 'tests/test_plugin_onboarding.py'
      - 'tests/test_plugin_onboarding_headless.py'
      - '.github/workflows/p73-headless-autocheck.yml'
      - 'docs/P73-HEADLESS-AUTOCHECK.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require no invented GUI, no forged technical coverage and P72 regression PASS
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_plugin_onboarding.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P72 regression' }
          python -m unittest discover -s tests -p test_plugin_onboarding_headless.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P73 negative contracts failed' }
          python -m py_compile tests/run_plugin_onboarding.py
          if ($LASTEXITCODE -ne 0) { throw 'P73 invalid Python' }

  real-vst3-headless:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Compile real native GUI/audio/stress hosts and good/broken state VST3 fixtures
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P73 CMake configure failed' }
          cmake --build build --config Release --parallel 4 --target TestLabGUI TestLabHost TestLabStateStress QAStateMode0 QAStateMode2
          if ($LASTEXITCODE -ne 0) { throw 'P73 source-built real VST3 failed' }
      - name: Confirm real no-editor VST3 is onboarded without GUI and technical failure is caught
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gui = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $audio = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $stress = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          if ($gui.Count -ne 1 -or $audio.Count -ne 1 -or $stress.Count -ne 1) { throw 'P73 native hosts absent' }
          foreach ($variant in @('0','2')) {
            $bundle = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_State_$variant.vst3")
            if ($bundle.Count -ne 1) { throw "P73 actual state fixture $variant missing" }
            $PSNativeCommandUseErrorActionPreference = $false
            python tests/run_plugin_onboarding.py --plugin $bundle[0].FullName --gui-host $gui[0].FullName --out "build/p73/$variant" --audio-host $audio[0].FullName --stress-host $stress[0].FullName --run-technical-baseline --timeout 110
            $code = $LASTEXITCODE
            $report = Get-Content "build/p73/$variant/PLUGIN-ONBOARDING-RESULT.json" -Raw | ConvertFrom-Json
            if ($variant -eq '0') {
              if ($code -ne 0 -or $report.status -ne 'REVIEW_PACK_COMPLETE' -or
                  $report.gui_editor_status -ne 'VST3_NO_EDITOR_EXPOSED' -or
                  $report.native_technical_status -ne 'TECHNICAL_PASS' -or
                  @($report.native_technical_verified_coverage).Count -ne 3) {
                throw 'P73 good actual headless VST3 not correctly auto-checked'
              }
            } else {
              if ($code -ne 1 -or $report.status -ne 'FAIL') {
                throw 'P73 deliberately defective real headless VST3 falsely passed'
              }
            }
            if ($report.release_approved -ne $false -or $report.clicks_performed -ne 0) {
              throw 'P73 claimed release or performed unapproved GUI clicks'
            }
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P73-real-headless-VST3-good-bad-onboarding-technical-evidence
          path: build/p73/
          if-no-files-found: warn
