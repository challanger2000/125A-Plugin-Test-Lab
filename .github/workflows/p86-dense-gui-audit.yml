name: P86 dense native unknown-VST3 GUI observation coverage
on:
  pull_request:
    paths:
      - 'tests/run_gui_dense_audit.py'
      - 'tests/test_p86_dense_gui_audit.py'
      - 'tests/run_universal_qa.py'
      - 'tests/run_vst3_batch_qa.py'
      - '.github/workflows/p86-dense-gui-audit.yml'
      - 'docs/P86-DENSE-GUI-AUDIT.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dense-audit:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify audited/sharded GUI coordinates and P74/P83 backwards compatibility
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_p86_dense_gui_audit.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P86 dense audit integration FAILED' }
          python -m unittest discover -s tests -p test_p83_batch_gui_exploration.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P83 batch compatibility FAILED' }
          python -m unittest discover -s tests -p test_universal_qa.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P74 backwards compatibility FAILED' }
          python -m py_compile tests/run_gui_dense_audit.py tests/run_universal_qa.py tests/run_vst3_batch_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'P86 Python compilation FAILED' }
      - name: Compile active/inert native Win32 VST3 editors and native GUI host
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P86 CMake configure FAILED' }
          cmake --build build --config Release --parallel 4 --target TestLabGUI QAGuiClick QAGuiInert
          if ($LASTEXITCODE -ne 0) { throw 'P86 Windows VST3 compilation FAILED' }
      - name: Full 3x3 real native sham/click GUI survey on active and inert VST3s
        shell: pwsh
        run: |
          $gui = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Click.vst3')
          $inert = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Inert.vst3')
          if ($gui.Count -ne 1 -or $good.Count -ne 1 -or $inert.Count -ne 1) {
            throw 'P86 real GUI host/plugin fixture missing or ambiguous'
          }
          foreach ($c in @(
            @{name='active';bundle=$good[0].FullName;shouldFind=$true},
            @{name='inert';bundle=$inert[0].FullName;shouldFind=$false}
          )) {
            $out = "build/p86/$($c.name)"
            python tests/run_universal_qa.py --plugin $c.bundle --gui-host $gui[0].FullName --out $out --explore-unknown-gui --dense-gui-grid 3 --exploration-repeats 1
            if ($LASTEXITCODE -ne 0) { throw "P86 native dense audit FAIL: $($c.name)" }
            $r = Get-Content "$out/UNIVERSAL-QA-RESULT.json" -Raw | ConvertFrom-Json
            $d = Get-Content "$out/unknown-gui-dense-sweep/DENSE-GUI-AUDIT-RESULT.json" -Raw | ConvertFrom-Json
            if ($r.status -ne 'INVENTORY_WITH_EXPLORATORY_OBSERVATIONS' -or
                $r.unknown_gui_dense_grid -ne 3 -or
                $r.unknown_gui_grid_coverage -ne 'SAMPLED POINTS ONLY' -or
                $r.exploratory_clicks_performed -ne 9 -or
                $d.status -ne 'SAMPLED_GRID_COMPLETE' -or
                $d.completed_points -ne 9 -or
                $d.observations.Count -ne 9 -or
                $d.control_semantics -ne 'NOT ESTABLISHED' -or
                $d.all_controls_discovered -ne $false -or
                $r.release_approved -ne $false) {
              throw "P86 incorrect native scan evidence: $($c.name)"
            }
            if ($c.shouldFind) {
              if ($d.distinct_observed_candidates -lt 1) {
                throw 'P86 active real GUI control not detected at sample-grid center'
              }
            } elseif ($d.distinct_observed_candidates -ne 0) {
              throw 'P86 inert GUI was falsely detected as active'
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P86-full-native-GUI-grid-shards-observations
          path: build/p86/
          if-no-files-found: warn
