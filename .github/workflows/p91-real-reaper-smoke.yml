name: P91 real REAPER evaluation smoke (native Windows DAW)
on:
  pull_request:
    paths:
      - 'tests/run_reaper_daw_qa.py'
      - 'tests/reaper_qa_driver.lua'
      - '.github/workflows/p91-real-reaper-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-reaper:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download official REAPER 7.83 evaluation installer with published SHA256
        shell: pwsh
        run: |
          $url = 'https://www.reaper.fm/files/7.x/reaper783_x64-install.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\reaper-installer.exe"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\reaper-installer.exe" -Algorithm SHA256).Hash
          if ($hash -ne 'A1F0EA602806145C2648F7F678974BDA35304B178D29CF72D8255B7218A5E0C8') {
            throw 'REAPER official installer fingerprint mismatch'
          }
          Start-Process -FilePath "$env:RUNNER_TEMP\reaper-installer.exe" -ArgumentList '/S' -Wait
          $exe = 'C:\Program Files\REAPER (x64)\reaper.exe'
          if (-not (Test-Path $exe)) { throw 'Official REAPER not installed' }
          "P91_REAPER_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build original 125A MIDI-sensitive source-defined real VST3
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P91 VST3 configure failed' }
          cmake --build build --config Release --parallel 4 --target QASignalGood
          if ($LASTEXITCODE -ne 0) { throw 'P91 VST3 fixture build failed' }
          $modules = @(Get-ChildItem build -Recurse -File -Filter '125A_QA_SignalGood.vst3')
          if ($modules.Count -ne 1) { throw 'P91 VST3 fixture module not unique' }
          $src = $modules[0].FullName
          $bundle = Split-Path (Split-Path (Split-Path $src -Parent) -Parent) -Parent
          if ((Split-Path $bundle -Leaf) -ne '125A_QA_SignalGood.vst3') {
            throw "P91 invalid source VST3 bundle: $bundle"
          }
          $destination = 'C:\Program Files\Common Files\VST3\125A_QA_SignalGood.vst3'
          Copy-Item -LiteralPath $bundle -Destination $destination -Recurse
          $dll = Join-Path $destination 'Contents\x86_64-win\125A_QA_SignalGood.vst3'
          if (-not (Test-Path $dll)) { throw 'P91 module missing after VST3 installation' }
          "P91_VST3_MODULE=$dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Invoke actual REAPER project MIDI save reload and CLI render
        shell: pwsh
        run: |
          $plan = @{
            schema = '125a-reaper-daw-test-v1'
            reaper = @{
              exe = $env:P91_REAPER_EXE
              sha256 = (Get-FileHash $env:P91_REAPER_EXE -Algorithm SHA256).Hash.ToLower()
            }
            plugin = @{
              module = $env:P91_VST3_MODULE
              sha256 = (Get-FileHash $env:P91_VST3_MODULE -Algorithm SHA256).Hash.ToLower()
              reaper_fx_name = 'VST3: 125A QA Signal Good'
            }
            test = @{
              sample_rate = 44100
              tempo_bpm = 120
              note = 36
              velocity = 102
              seconds = 2
              expect_audio = $false
              minimum_rms = 0.01
            }
          }
          $plan | ConvertTo-Json -Depth 8 | Out-File "$env:RUNNER_TEMP\p91-reaper-plan.json" -Encoding utf8
          python tests/run_reaper_daw_qa.py --plan "$env:RUNNER_TEMP\p91-reaper-plan.json" --out build/p91-real-smoke --timeout 35
          if ($LASTEXITCODE -ne 0) { throw 'P91 actual REAPER process integration failed' }
          $report = Get-Content build/p91-real-smoke/REAPER-DAW-ACCEPTANCE.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'REAL_REAPER_DAW_PIPELINE_PASS' -or
              $report.reloaded_project_verified -ne $true -or
              $report.rendered_by_reaper_process -ne $true -or
              $report.physical_asio_hardware -ne 'NOT RUN' -or
              $report.release_approved -ne $false) {
            throw 'P91 real REAPER evidence was incomplete'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P91-REAPER-7_83-genuine-windows-daw-evidence
          path: |
            build/p91-real-smoke/REAPER-DAW-ACCEPTANCE.json
            build/p91-real-smoke/125A_Reaper_Project.RPP
            build/p91-real-smoke/setup.status
            build/p91-real-smoke/reload.status
          if-no-files-found: warn
