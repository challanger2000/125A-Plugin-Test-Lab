name: P67 mandatory declared-feature coverage gate

on:
  pull_request:
    paths:
      - 'tests/product_feature_coverage.py'
      - 'tests/run_product_test_plan.py'
      - 'tests/test_product_feature_coverage.py'
      - '.github/workflows/p67-feature-coverage.yml'
      - 'docs/P67-REQUIRED-FEATURE-COVERAGE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-evidence:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reject untested required features, stale manifests, forged results and unsafe waivers
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_product_feature_coverage.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P67 independent required coverage regressions FAILED' }
          python -m unittest discover -s tests -p test_product_test_plan.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P65 existing plan backwards compatibility failed' }
          python -m unittest discover -s tests -p test_product_test_plan_quickcheck.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P66 technical audio coverage backwards compatibility failed' }
          python -m py_compile tests/product_feature_coverage.py tests/run_product_test_plan.py tests/test_product_feature_coverage.py
          if ($LASTEXITCODE -ne 0) { throw 'P67 Python compile failed' }

  real-vst3-uncovered-feature:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build independently source-defined actual GUI VST3 and Windows host
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P67 CMake configure failed' }
          cmake --build build --config Release --parallel 4 --target TestLabGUI QAGuiAnalogGood
          if ($LASTEXITCODE -ne 0) { throw 'P67 real native Windows VST3 build failed' }
      - name: Show green native parameter test cannot hide missing required MIDI export
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostFile = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $bundle = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_AnalogGood.vst3')
          if ($hostFile.Count -ne 1 -or $bundle.Count -ne 1) { throw 'P67 real host or GUI fixture missing' }
          $dll = @(Get-ChildItem $bundle[0].FullName -Recurse -File -Filter '*.vst3')
          if ($dll.Count -ne 1) { throw 'P67 actual native plugin DLL missing' }
          $module = $dll[0].FullName
          $fingerprint = (Get-FileHash $module -Algorithm SHA256).Hash.ToLowerInvariant()
          $hostSha = (Get-FileHash $hostFile[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force build/p67 | Out-Null
          $plan = @{
            schema='125a-product-test-plan-v1'
            product=@{id='p67_analog';module=$module;sha256=$fingerprint}
            hosts=@{gui=@{path=$hostFile[0].FullName;sha256=$hostSha}}
            cases=@(
              @{
                id='approved_gain_control'
                kind='gesture_sweep'
                contract=@{
                  schema='125a-gui-gesture-sweep-v1'
                  product=@{binary=$module;sha256=$fingerprint}
                  gui_host=$hostFile[0].FullName
                  param_id=9001
                  initial_normalized=0.0
                  checkpoints=@(
                    @{start_x=40;start_y=90;end_x=100;end_y=90;expected_normalized=0.25},
                    @{start_x=100;start_y=90;end_x=160;end_y=90;expected_normalized=0.5},
                    @{start_x=160;start_y=90;end_x=220;end_y=90;expected_normalized=0.75},
                    @{start_x=220;start_y=90;end_x=280;end_y=90;expected_normalized=1.0},
                    @{start_x=280;start_y=90;end_x=40;end_y=90;expected_normalized=0.0}
                  )
                }
              }
            )
          }
          $plan | ConvertTo-Json -Depth 12 | Set-Content -Encoding utf8 build/p67/plan.json
          $feature = @{
            schema='125a-product-feature-matrix-v1'
            product_id='p67_analog'
            module_sha256=$fingerprint
            features=@(
              @{id='gain';title='Native bidirectional gain control';criticality='required';case_ids=@('approved_gain_control');waiver=$null},
              @{id='midi_export';title='Unverified MIDI export functionality';criticality='required';case_ids=@();waiver=$null}
            )
          }
          $feature | ConvertTo-Json -Depth 12 | Set-Content -Encoding utf8 build/p67/matrix-missing.json
          $PSNativeCommandUseErrorActionPreference = $false
          python tests/run_product_test_plan.py --plan build/p67/plan.json --coverage-matrix build/p67/matrix-missing.json --out build/p67/missing
          if ($LASTEXITCODE -ne 1) { throw 'P67 missing mandatory feature did NOT block complete qualification' }
          $native = Get-Content build/p67/missing/PRODUCT-TEST-PLAN-RESULT.json -Raw | ConvertFrom-Json
          $coverage = Get-Content build/p67/missing/PRODUCT-FEATURE-COVERAGE.json -Raw | ConvertFrom-Json
          if ($native.status -ne 'CONTRACT_PASS' -or $native.passed_cases -ne 1 -or
              $native.required_feature_coverage -ne 'REQUIRED_COVERAGE_INCOMPLETE' -or
              $coverage.required_passed -ne 1 -or
              $coverage.required_unverified[0] -ne 'midi_export' -or $coverage.release_approved -ne $false) {
            throw 'P67 native PASS failed to expose untested required feature'
          }
          $feature.features = @($feature.features[0])
          $feature | ConvertTo-Json -Depth 12 | Set-Content -Encoding utf8 build/p67/matrix-covered.json
          python tests/run_product_test_plan.py --plan build/p67/plan.json --coverage-matrix build/p67/matrix-covered.json --out build/p67/covered
          if ($LASTEXITCODE -ne 0) { throw 'P67 verified required-only feature list failed technical qualification' }
          $complete = Get-Content build/p67/covered/PRODUCT-TEST-PLAN-RESULT.json -Raw | ConvertFrom-Json
          if ($complete.required_feature_coverage -ne 'REQUIRED_COVERAGE_COMPLETE' -or
              $complete.release_approved -ne $false -or
              $complete.full_product_functional_coverage -ne 'NOT COVERED') {
            throw 'P67 mistakenly interpreted declared feature coverage as release certification'
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P67-real-VST3-uncertified-mandatory-feature-matrix
          path: build/p67/
          if-no-files-found: warn
