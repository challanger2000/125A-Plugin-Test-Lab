name: P99 audit-only P95 PCM oracle counterproof
on:
  pull_request:
    paths:
      - 'tests/audit_p99_oracle_counterproof.py'
      - 'tests/audit_p99_host_context_challenge.py'
      - 'tests/verify_virtual_asio_loopback.py'
      - 'tests/run_virtual_asio_loopback.py'
      - 'tests/test_p95_virtual_asio_loopback.py'
      - 'tests/virtual_asio_signal_fixture.cpp'
      - 'src/physical_asio.cpp'
      - '.github/workflows/p99-audit-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-adversarial-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Execute real P95 Python verifier with independent wrong-frequency stimulus
        run: |
          python -m unittest discover -s tests -p test_p95_virtual_asio_loopback.py -v
          python tests/audit_p99_oracle_counterproof.py
          python tests/audit_p99_host_context_challenge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P99-AUDIT-KNOWN-ORACLE-GAP-NOT-RELEASE-APPROVAL
          path: artifacts/P99-audit/*.json
          if-no-files-found: error
