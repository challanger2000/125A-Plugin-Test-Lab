name: P66 universal technical audio quickcheck in product plans

on:
  pull_request:
    paths:
      - 'tests/run_product_test_plan.py'
      - 'tests/test_product_test_plan_quickcheck.py'
      - '.github/workflows/p66-product-audio-adapter.yml'
      - 'docs/P65-PRODUCT-TEST-PLANS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reject fake audio, save, recall and physical ASIO claims
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_product_test_plan.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P65 backwards-compatibility regression' }
          python -m unittest discover -s tests -p test_product_test_plan_quickcheck.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P66 audio adapter contract regression' }
          python -m py_compile tests/run_product_test_plan.py
          if ($LASTEXITCODE -ne 0) { throw 'P66 standard plan runner invalid' }

  real-native-vst3-audio:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile real native VST3 host, stress host and working/defective plugins
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P66 configure failed' }
          cmake --build build --config Release --parallel 4 --target TestLabHost TestLabStateStress TestLabGUI QAStateMode0 QAStateMode2
          if ($LASTEXITCODE -ne 0) { throw 'P66 real native test fixtures failed to compile' }
      - name: Run same universal plan type on real audio-good and save-defective VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gui = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $audio = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $stress = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          if ($gui.Count -ne 1 -or $audio.Count -ne 1 -or $stress.Count -ne 1) {
            throw 'Missing native Windows VST3 audio, stress or GUI test host'
          }
          $hosts = @{
            gui=@{path=$gui[0].FullName;sha256=(Get-FileHash $gui[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            audio=@{path=$audio[0].FullName;sha256=(Get-FileHash $audio[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            stress=@{path=$stress[0].FullName;sha256=(Get-FileHash $stress[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          New-Item -ItemType Directory -Force build/p66 | Out-Null
          foreach ($variant in @('0','2')) {
            $bundle = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_State_$variant.vst3")
            if ($bundle.Count -ne 1) { throw "P66 missing native $variant VST3" }
            $dll = @(Get-ChildItem $bundle[0].FullName -Recurse -File -Filter '*.vst3')
            if ($dll.Count -ne 1) { throw 'Ambiguous real native VST3 DLL' }
            $product = @{id="audio_$($variant.ToLowerInvariant())";module=$dll[0].FullName;sha256=(Get-FileHash $dll[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            $plan = @{
              schema='125a-product-test-plan-v1'
              product=$product
              hosts=$hosts
              cases=@(
                @{
                  id='audio_save_technical'
                  kind='technical_quickcheck'
                  contract=@{required_coverage=@('api_playback_save','sample_rate_buffer_matrix','native_audio_state_capture')}
                }
              )
            }
            $file = "build/p66/$variant-plan.json"
            $plan | ConvertTo-Json -Depth 9 | Set-Content -Encoding utf8 $file
            $PSNativeCommandUseErrorActionPreference = $false
            python tests/run_product_test_plan.py --plan $file --out "build/p66/$variant" --timeout 120
            $code = $LASTEXITCODE
            $report = Get-Content "build/p66/$variant/PRODUCT-TEST-PLAN-RESULT.json" -Raw | ConvertFrom-Json
            if ($variant -eq '0') {
              if ($code -ne 0 -or $report.status -ne 'CONTRACT_PASS' -or $report.passed_cases -ne 1) {
                throw 'P66 independent real VST3 native technical audio/save case did not pass'
              }
            } else {
              if ($code -ne 1 -or $report.status -ne 'FAIL' -or $report.failed_cases -ne 1) {
                throw 'P66 deliberately broken concurrent-save real VST3 was not rejected'
              }
            }
            if ($report.release_approved -ne $false -or $report.physical_asio_hardware -ne 'NOT RUN' -or $report.real_commercial_daw_session -ne 'NOT RUN') {
              throw 'P66 fabricated physical ASIO/DAW/release approval'
            }
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P66-product-plan-technical-audio-good-bad-evidence
          path: build/p66/
          if-no-files-found: warn
