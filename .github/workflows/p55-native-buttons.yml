name: P55 real native button discovery and sham clicks

on:
  pull_request:
    paths:
      - 'tests/run_gui_native_buttons.py'
      - 'tests/test_gui_native_buttons.py'
      - '.github/workflows/p55-native-buttons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: P55 independent native button-sham negative tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_gui_native_buttons.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P55 adversarial tests failed' }
          python -m py_compile tests/run_gui_native_buttons.py tests/test_gui_native_buttons.py
          if ($LASTEXITCODE -ne 0) { throw 'P55 runner invalid' }

  real-native:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build native GUI test host and source-built Win32 nested button VST3
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P55 configure failed' }
          cmake --build build --config Release --parallel 4 --target TestLabGUI QAGuiNested QAGuiPaintedOnly
          if ($LASTEXITCODE -ne 0) { throw 'P55 native build failed' }
      - name: Independently probe actual discovered BUTTON with matched sham
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hosts = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          if ($hosts.Count -ne 1) { throw 'Native Win32 GUI host missing' }
          foreach ($variant in @('Nested', 'PaintedOnly')) {
            $bundle = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_GUI_$variant.vst3")
            if ($bundle.Count -ne 1) { throw "P55 $variant module missing" }
            python tests/run_gui_native_buttons.py --plugin $bundle[0].FullName --gui-host $hosts[0].FullName --out "build/p55-$variant" --acknowledge-ui-clicks
            if ($LASTEXITCODE -ne 0) { throw "P55 actual $variant scan failed" }
            $r = Get-Content "build/p55-$variant/NATIVE-BUTTON-PROBES.json" -Raw | ConvertFrom-Json
            if ($r.status -ne 'OBSERVATIONS_COMPLETE' -or $r.release_approved -ne $false -or $r.complete_product_gui_controls -ne 'NOT COVERED') {
              throw "P55 $variant falsely declared product GUI complete"
            }
            if ($variant -eq 'Nested') {
              if ($r.probed_buttons -ne 1 -or $r.observations[0].control_id -ne 43001) {
                throw 'P55 did not target the actual discovered native BUTTON'
              }
              $parameterChanges = @($r.observations[0].changed_parameters | Where-Object { $_.param_id -eq 9001 })
              if ($parameterChanges.Count -ne 1 -or $r.observations[0].classification -notmatch 'PARAMETER') {
                throw 'P55 native BUTTON click not independently attributed to actual controller'
              }
            } else {
              if ($r.probed_buttons -ne 0 -or $r.discovered_buttons -ne 0) {
                throw 'P55 incorrectly invented HWND BUTTON in painted-only plugin'
              }
            }
          }
          Write-Host '[PASS] P55 real native HWND-button discovery and sham-controlled clicking'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P55-real-native-button-sham-evidence
          path: |
            build/p55-Nested/
            build/p55-PaintedOnly/
          if-no-files-found: warn
