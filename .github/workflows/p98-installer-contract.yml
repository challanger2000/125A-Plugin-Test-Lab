name: P98 installer fail-closed regression
on:
  pull_request:
    paths:
      - 'tests/Invoke-InstallerInventory.ps1'
      - '.github/workflows/p98-installer-*.yml'
      - 'docs/P98-INSTALLER-INVENTORY.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-gates:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise denial and wrong-hash without ever running EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Join-Path $env:RUNNER_TEMP 'p98-test'
          New-Item -ItemType Directory -Path $test -Force | Out-Null
          $fake = Join-Path $test 'fixture.exe'
          [IO.File]::WriteAllBytes($fake, [byte[]](1,2,3,4))
          $sha = (Get-FileHash $fake -Algorithm SHA256).Hash
          & powershell -NoProfile -File tests/Invoke-InstallerInventory.ps1 -Installer $fake -ExpectedSha256 $sha -OutputFolder (Join-Path $test 'denied')
          if ($LASTEXITCODE -ne 1) { throw 'Missing consent unexpectedly accepted' }
          $denied = Get-Content (Join-Path $test 'denied/INSTALLER-INVENTORY.json') -Raw | ConvertFrom-Json
          if ($denied.status -ne 'FAIL' -or $denied.execution_approved -ne $false -or $denied.release_approved -ne $false) { throw 'Denial evidence invalid' }
          & powershell -NoProfile -File tests/Invoke-InstallerInventory.ps1 -Installer $fake -ExpectedSha256 ('0' * 64) -OutputFolder (Join-Path $test 'wronghash') -ApproveExecution
          if ($LASTEXITCODE -ne 1) { throw 'Wrong checksum unexpectedly accepted' }
          $mismatch = Get-Content (Join-Path $test 'wronghash/INSTALLER-INVENTORY.json') -Raw | ConvertFrom-Json
          if ($mismatch.status -ne 'FAIL' -or $mismatch.error -notmatch 'SHA256 mismatch' -or $mismatch.release_approved -ne $false) { throw 'Checksum evidence invalid' }
          Write-Output 'P98 fail-closed negative checks passed; NO installer executed.'
          # Build a harmless source-defined executable: proves actual Windows process execution
          # and that a newly installed file is captured in the inventory.
          $project = Join-Path $test 'harmless-app'
          dotnet new console --framework net8.0 -o $project --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Could not create harmless fixture project' }
          $source = @'
          using System;
          using System.IO;
          var dir = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "125A_P98_Fixture");
          Directory.CreateDirectory(dir);
          File.WriteAllText(Path.Combine(dir, "fixture-installed.txt"), "p98-fixture-ok");
          '@
          Set-Content -LiteralPath (Join-Path $project 'Program.cs') -Value $source -Encoding UTF8
          dotnet publish $project -c Release -r win-x64 --self-contained false -p:UseAppHost=true -o (Join-Path $test 'published')
          if ($LASTEXITCODE -ne 0) { throw 'Could not build harmless native Windows process fixture' }
          $good = Join-Path $test 'published/harmless-app.exe'
          if (-not (Test-Path $good)) { throw 'Missing native fixture EXE' }
          $goodSha = (Get-FileHash $good -Algorithm SHA256).Hash
          & powershell -NoProfile -File tests/Invoke-InstallerInventory.ps1 -Installer $good -ExpectedSha256 $goodSha -OutputFolder (Join-Path $test 'positive') -ApproveExecution -TimeoutSeconds 30 -InventoryRoots (Join-Path $env:LOCALAPPDATA '125A_P98_Fixture')
          if ($LASTEXITCODE -ne 0) {
            Get-Content (Join-Path $test 'positive/INSTALLER-INVENTORY.json') -Raw -ErrorAction SilentlyContinue | Write-Output
            throw 'Actual harmless installer process failed'
          }
          $result = Get-Content (Join-Path $test 'positive/INSTALLER-INVENTORY.json') -Raw | ConvertFrom-Json
          if ($result.status -ne 'INSTALLER_EXECUTED_INVENTORY_CAPTURED' -or $result.exit_code -ne 0 -or $result.release_approved -ne $false) {
            throw 'Positive native Windows execution evidence invalid'
          }
          if (@($result.added | Where-Object { $_ -match '125A_P98_Fixture.*fixture-installed\\.txt$' }).Count -ne 1) {
            throw 'Actual installed file was not detected'
          }
          Write-Output 'P98 real harmless EXE execution and installed-file inventory PASS.'
          $global:LASTEXITCODE = 0
          exit 0
