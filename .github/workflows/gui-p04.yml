name: P04 Native VST3 GUI Input Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/gui_host.cpp'
      - 'tests/run_gui_control_matrix.py'
      - 'tests/gui_fixture.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/gui-p04.yml'
  workflow_dispatch:

concurrency:
  group: 125a-testlab-p04-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  win32-vst3-gui:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pinned VST3 SDK
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Compile GUI host and two real GUI VST3s
        shell: pwsh
        run: |
          cmake --build build --config Release --target TestLabGUI QAGuiClick QAGuiInert QASignalGood --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "P04 build failed" }

      - name: Native Win32 click-to-VST3 parameter proof and negative control
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = @(Get-ChildItem build -Recurse -File -Filter "125A_Test_Lab_GUI.exe")
          $good = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_GUI_Click.vst3")
          $inert = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_GUI_Inert.vst3")
          $editorless = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_SignalGood.vst3")
          if ($exe.Count -ne 1 -or $good.Count -ne 1 -or $inert.Count -ne 1 -or $editorless.Count -ne 1) {
            throw "P04 executable / fixture path not unique or missing"
          }
          & $exe[0].FullName --prove-click $good[0].FullName 9001 2>&1 |
            Tee-Object -FilePath build/p04-click-good.log
          if ($LASTEXITCODE -ne 0) {
            throw "P04 good VST3 GUI did not receive native click"
          }
          $goodLog = Get-Content build/p04-click-good.log -Raw
          if (-not $goodLog.Contains("native click changed VST3 parameter 9001") -or
              -not $goodLog.Contains("two actual editor attach/message/input/detach cycles")) {
            throw "P04 missing explicit positive native GUI observation"
          }
          & $exe[0].FullName --prove-click $inert[0].FullName 9001 2>&1 |
            Tee-Object -FilePath build/p04-click-inert.log
          if ($LASTEXITCODE -ne 1) {
            throw "P04 deliberately inert GUI expected FAIL exit code 1"
          }
          $badLog = Get-Content build/p04-click-inert.log -Raw
          if (-not $badLog.Contains("GUI parameter unchanged after native click")) {
            throw "P04 negative control failed for wrong reason"
          }
          & $exe[0].FullName --probe $good[0].FullName 2>&1 |
            Tee-Object -FilePath build/p04-lifecycle.log
          if ($LASTEXITCODE -ne 0) { throw "P04 basic editor lifecycle probe failed" }
          & $exe[0].FullName --probe $editorless[0].FullName 2>&1 |
            Tee-Object -FilePath build/p04-editorless.log
          if ($LASTEXITCODE -ne 10) {
            throw "P04 expected INCONCLUSIVE (10) from a real GUI-less VST3"
          }
          if (-not (Get-Content build/p04-editorless.log -Raw).Contains("[INCONCLUSIVE]")) {
            throw "Editorless fixture was not explicitly classified INCONCLUSIVE"
          }
          Write-Host "[PASS] P04 actual GUI HWND, two click cycles, VST3 parameter observation, inert negative control, editorless INCONCLUSIVE"
          exit 0

      - name: Native GUI control-coordinate oracle, real and broken fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifact/gui-matrix | Out-Null
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $good = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Click.vst3')
          $inert = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_Inert.vst3')
          if ($exe.Count -ne 1 -or $good.Count -ne 1 -or $inert.Count -ne 1) {
            throw 'GUI control matrix native fixture missing'
          }
          function Write-ControlManifest($bundle, $expected, $x, $out) {
            $modules = @(Get-ChildItem -LiteralPath $bundle -Recurse -File -Filter '*.vst3')
            if ($modules.Count -ne 1) { throw 'GUI fixture module missing or ambiguous' }
            @{
              schema = '125a-gui-controls-v1'
              product = @{ binary = $modules[0].FullName; sha256 = (Get-FileHash $modules[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
              gui_host = $exe[0].FullName
              controls = @(@{ id = 'native_click'; param_id = 9001; x = $x; y = 90; expected_normalized = $expected })
            } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $out
          }
          Write-ControlManifest $good[0].FullName 1.0 160 artifact/gui-matrix/good.json
          python tests/run_gui_control_matrix.py --manifest artifact/gui-matrix/good.json --out artifact/gui-matrix/good
          if ($LASTEXITCODE -ne 0) { throw 'Real GUI parameter click failed' }
          $report = Get-Content artifact/gui-matrix/good/GUI-CONTROL-RESULT.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'TECHNICAL_PASS' -or $report.all_product_controls -ne 'NOT COVERED' -or
              $report.tested_controls -ne 1) { throw 'GUI matrix falsely claimed full product coverage' }
          Write-ControlManifest $inert[0].FullName 1.0 160 artifact/gui-matrix/inert.json
          Write-ControlManifest $good[0].FullName 0.5 160 artifact/gui-matrix/wrong-expected.json
          Write-ControlManifest $good[0].FullName 1.0 500 artifact/gui-matrix/outside.json
          foreach ($negative in @('inert','wrong-expected','outside')) {
            python tests/run_gui_control_matrix.py --manifest "artifact/gui-matrix/$negative.json" --out "artifact/gui-matrix/$negative"
            if ($LASTEXITCODE -ne 1) { throw "GUI matrix did not reject $negative" }
            $failed = Get-Content "artifact/gui-matrix/$negative/GUI-CONTROL-RESULT.json" -Raw | ConvertFrom-Json
            if ($failed.status -ne 'FAIL') { throw "GUI negative $negative was not classified FAIL" }
          }
          Write-Host '[PASS] Native GUI coordinates, actual parameter observation and three negative controls'
          exit 0

      - name: Collect logs and proven GUI executable
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact -ErrorAction SilentlyContinue | Out-Null
          foreach ($name in @("p04-click-good.log","p04-click-inert.log","p04-lifecycle.log","p04-editorless.log")) {
            if (Test-Path "build/$name") { Copy-Item "build/$name" "artifact/$name" }
          }
          $exe = @(Get-ChildItem build -Recurse -File -Filter "125A_Test_Lab_GUI.exe")
          if ($exe.Count -eq 1) {
            Copy-Item $exe[0].FullName artifact/
            Get-FileHash $exe[0].FullName -Algorithm SHA256 |
              Format-List | Out-File artifact/SHA256.txt
          }
          @(
            "P04 only proves synthetic VST3 editor attachment and native HWND input delivery.",
            "The negative fixture intentionally ignores the click; the host must return FAIL.",
            "This is not a pixel or screen-reader audit of third-party plugin controls.",
            "No Drumator product sources or binary have been changed."
          ) | Set-Content artifact/P04-SCOPE.txt

      - name: Upload GUI host and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Plugin-Test-Lab-P04-GUI-Windows-x64
          path: artifact/
          if-no-files-found: error
