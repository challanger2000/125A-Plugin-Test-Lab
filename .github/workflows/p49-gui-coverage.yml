name: P49 bounded GUI coverage sampler

on:
  pull_request:
    paths:
      - 'tests/run_gui_coverage_scan.py'
      - 'tests/test_gui_coverage_scan.py'
      - '.github/workflows/p49-gui-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic and adversarial sampler tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_gui_coverage_scan.py -v
          if ($LASTEXITCODE -ne 0) { throw "P49 regression tests failed" }
      - name: Compile Python runners
        shell: pwsh
        run: |
          python -m py_compile tests/run_gui_coverage_scan.py tests/test_gui_coverage_scan.py
          if ($LASTEXITCODE -ne 0) { throw "P49 syntax compilation failed" }

  native-smoke:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure actual native GUI host and fixture
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
          cmake --build build --config Release --target TestLabGUI QAGuiPaintedOnly --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Native GUI fixture build failed" }
      - name: Exercise P49 on real source-built VST3 and Win32 GUI host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $plugins = @(Get-ChildItem build -Recurse -Directory -Filter '125A_QA_GUI_PaintedOnly.vst3')
          if ($hostExe.Count -ne 1 -or $plugins.Count -ne 1) { throw 'Native GUI host/fixture missing' }
          python tests/run_gui_coverage_scan.py --plugin $plugins[0].FullName --gui-host $hostExe[0].FullName --out build/p49-real --columns 2 --rows 2 --acknowledge-ui-clicks
          if ($LASTEXITCODE -ne 0) { throw 'P49 native GUI scan failed' }
          $report = Get-Content build/p49-real/GUI-COVERAGE-SCAN.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'OBSERVATIONS_COMPLETE' -or $report.completed_points -ne 4 -or $report.batches.Count -ne 1 -or $report.release_approved -ne $false -or $report.product_gui_controls -ne 'NOT COVERED') {
            throw 'P49 real VST3 evidence invalid or overstated'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P49-real-Win32-VST3-GUI-evidence
          path: build/p49-real/
          if-no-files-found: warn
