name: P61 actual Win32 owned-dialog button navigation

on:
  pull_request:
    paths:
      - 'src/gui_host.cpp'
      - 'tests/gui_fixture.cpp'
      - 'tests/run_gui_owned_dialog.py'
      - 'tests/test_gui_dialog_button.py'
      - '.github/workflows/p61-dialog-button.yml'
  workflow_dispatch:

concurrency:
  group: p93-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Strict independent native dialog button and dismissal evidence
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_gui_dialog_button.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P61 child-button contract regression failed' }

  actual-native-dialog-button:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build source-based actual Win32 dialog with/without actionable button
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P61 configure failed' }
          cmake --build build --config Release --parallel 4 --target TestLabGUI QAGuiDialogGood QAGuiDialogNoButton
          if ($LASTEXITCODE -ne 0) { throw 'P61 real native Windows VST3 build failed' }
      - name: Click real dialog child button; independently reject missing button
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          if ($exe.Count -ne 1) { throw 'Actual VST3 GUI host missing' }
          foreach ($variant in @('Good', 'NoButton')) {
            $plugin = @(Get-ChildItem build -Recurse -Directory -Filter "125A_QA_GUI_Dialog$variant.vst3")
            if ($plugin.Count -ne 1) { throw "Actual $variant fixture missing" }
            $PSNativeCommandUseErrorActionPreference = $false
            python tests/run_gui_owned_dialog.py --plugin $plugin[0].FullName --gui-host $exe[0].FullName --out "build/p61-$variant" --x 160 --y 90 --acknowledge-ui-clicks --exercise-dialog-button
            $code = $LASTEXITCODE
            $r = Get-Content "build/p61-$variant/OWNED-DIALOG-RESULT.json" -Raw | ConvertFrom-Json
            if (Test-Path "build/p61-$variant/native.log") {
              Get-Content "build/p61-$variant/native.log" | ForEach-Object { Write-Host "P61 NATIVE: $_" }
            }
            if ($variant -eq 'Good') {
              if ($code -ne 0 -or $r.status -ne 'CONTRACT_PASS' -or $r.native_dialog_button -ne 'ACTUATED_AND_CLOSED' -or $r.observed_owned_dialogs -ne 1) {
                throw 'P61 real Win32 BUTTON did not dismiss real native dialog'
              }
            } else {
              if ($code -ne 1 -or $r.status -ne 'FAIL' -or $r.native_dialog_button -ne 'NOT TESTED') {
                throw 'P61 deliberately missing native dialog button was not rejected'
              }
            }
            if ($r.release_approved -ne $false) { throw 'P61 incorrectly certified commercial release' }
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P61-actual-Win32-dialog-button-native-proof
          path: |
            build/p61-Good/
            build/p61-NoButton/
          if-no-files-found: warn
